<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ElekiNail AR - Ver.0.81 Hoshio Lip-Sync & Blink Overload</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; position: fixed; width: 100%; height: 100%; }
        #webcam { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; transform: scaleX(1) !important; }
        #ar-canvas { position: absolute; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        #start-btn {
            position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%);
            padding: 18px 40px; font-size: 18px; font-weight: bold; color: #fff;
            background: linear-gradient(45deg, #ffcc00, #ff0055); border: none; border-radius: 50px; z-index: 100;
            box-shadow: 0 0 15px #ffcc00; cursor: pointer;
        }
        #status {
            position: absolute; top: 10px; left: 10px; color: #ffcc00; background: rgba(0,0,0,0.7);
            padding: 10px; font-size: 12px; z-index: 1000; border-radius: 5px;
        }
        #speech-bubble {
            position: absolute; top: 12%; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95); color: #111; padding: 12px 20px;
            border-radius: 20px; font-size: 15px; font-weight: bold; z-index: 500;
            display: none; border: 3px solid #ff0055; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            max-width: 80%; text-align: center;
        }
    </style>
</head>
<body>
    <video id="webcam" autoplay playsinline></video>
    <canvas id="ar-canvas"></canvas>
    <div id="status">ステータス: 準備完了。ボタンを押してください。</div>
    <div id="speech-bubble">「キブンちょい上げ！ベビースター！」</div>
    <button id="start-btn" onclick="initAR()">ホシオくんを手のひらに召喚！</button>

<script>
    let currentModelGroup = null, scene, camera, renderer, clock, hands;
    let hoshioMesh = null;
    
    // ダイナミクス ＆ 身体運動
    let isSpawned = false, spawnTime = 0, prevX = 0, velocityX = 0;
    let isCartwheeling = false, cartwheelProgress = 0, prevFingerStretch = 0;

    // 🌟 生体神経パルス（目パチ ＆ 口パク）制御変数
    let nextBlinkTime = 0;
    let isBlinking = false;
    let blinkTimer = 0;
    let isSpeaking = false;
    let speakTimer = 0;

    const statusEl = document.getElementById('status');
    const bubbleEl = document.getElementById('speech-bubble');
    function log(msg) { statusEl.innerText = `ステータス: ${msg}`; }

    const hoshioConfig = {
        path: './hoshio.png',
        name: 'ホシオくん',
        absoluteScale: 0.65,
        offsetY: -0.15
    };

    async function initAR() {
        document.getElementById('start-btn').style.display = 'none';
        log('高難度施術: 口パク＆目パチ神経系を接続中...');

        const video = document.getElementById('webcam');
        clock = new THREE.Clock();

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 1.8);

        renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('ar-canvas'), alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        scene.add(new THREE.AmbientLight(0xffffff, 2.2));

        currentModelGroup = new THREE.Group();
        scene.add(currentModelGroup);

        const textureLoader = new THREE.TextureLoader();
        textureLoader.load(hoshioConfig.path, (texture) => {
            const geometry = new THREE.PlaneGeometry(0.75, 1.0);
            
            // 🌟 目パチ＆口パク用の動的UVマテリアル
            const material = new THREE.MeshBasicMaterial({ 
                map: texture, 
                transparent: true, 
                side: THREE.DoubleSide 
            });
            
            hoshioMesh = new THREE.Mesh(geometry, material);
            const s = hoshioConfig.absoluteScale;
            hoshioMesh.scale.set(s, s, s);
            currentModelGroup.add(hoshioMesh);
            
            setupModelGroup();
        });

        function setupModelGroup() {
            currentModelGroup.visible = false;
            log(`${hoshioConfig.name} 神経パルス接続完了！手のひらをかざして下さい✋️`);
            startCamera(video);
        }
    }

    // 🌟 口パク会話発動
    function triggerSpeech() {
        if (!isSpeaking) {
            isSpeaking = true;
            speakTimer = 0;
            bubbleEl.style.display = 'block';
            bubbleEl.innerText = '「キブンちょい上げ！ベビースター食べて歌おうぜ〜！」';
            setTimeout(() => {
                isSpeaking = false;
                bubbleEl.style.display = 'none';
            }, 3000);
        }
    }

    function startCamera(video) {
        hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6 });
        
        hands.onResults((results) => {
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            if (currentModelGroup && results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const lm = results.multiHandLandmarks[0];
                
                const handBase = Math.sqrt(Math.pow(lm[9].x - lm[0].x, 2) + Math.pow(lm[9].y - lm[0].y, 2));
                const fingerLength = Math.sqrt(Math.pow(lm[12].x - lm[0].x, 2) + Math.pow(lm[12].y - lm[0].y, 2));
                const stretchRatio = fingerLength / handBase;

                if (stretchRatio > 1.45) {
                    if (!isSpawned) {
                        isSpawned = true;
                        spawnTime = time;
                        nextBlinkTime = time + 2.0; // 2秒後に最初の瞬き
                        triggerSpeech(); // 召喚時トーク発動
                    }

                    currentModelGroup.visible = true;
                    
                    const x = (lm[9].x - 0.5) * 2.2;
                    const dynamicOffsetY = -(lm[9].y - 0.5) * 3.0 + hoshioConfig.offsetY;

                    velocityX = (x - prevX) * 0.4 + velocityX * 0.6;
                    prevX = x;

                    // 1. 指ひらひら側転トリガー
                    const fingerWaveDelta = Math.abs(stretchRatio - prevFingerStretch);
                    prevFingerStretch = stretchRatio;

                    if (fingerWaveDelta > 0.08 && !isCartwheeling && (time - spawnTime > 0.8)) {
                        isCartwheeling = true;
                        cartwheelProgress = 0;
                    }

                    // 2. 登場回転 ＆ ぴょこぴょこ跳躍
                    const age = time - spawnTime;
                    let rotateY = (age < 0.6) ? (age / 0.6) * Math.PI * 2 : 0;
                    let spawnScale = (age < 0.6) ? Math.sin((age / 0.6) * Math.PI * 0.5) : 1.0;
                    
                    // 🌟 口パク時のピョンピョン増幅
                    const mouthMover = isSpeaking ? Math.abs(Math.sin(time * 18)) * 0.05 : 0;
                    const bounceY = Math.abs(Math.sin(time * 8)) * 0.06 + mouthMover;
                    
                    // 3. 側転アニメーション
                    let cartwheelRotationZ = 0, cartwheelJumpY = 0;
                    if (isCartwheeling) {
                        cartwheelProgress += delta * 4.0;
                        cartwheelRotationZ = -cartwheelProgress * Math.PI * 2;
                        cartwheelJumpY = Math.sin(cartwheelProgress * Math.PI) * 0.25;
                        if (cartwheelProgress >= 1.0) { isCartwheeling = false; cartwheelProgress = 0; }
                    }

                    const tiltZ = -velocityX * 1.8;
                    currentModelGroup.position.set(x, dynamicOffsetY + bounceY + cartwheelJumpY, 0);

                    // 🌟 4. 【目パチ（ブリンク）神経パルス制御】
                    let eyeScaleY = 1.0;
                    if (time > nextBlinkTime && !isBlinking) {
                        isBlinking = true;
                        blinkTimer = time;
                    }

                    if (isBlinking) {
                        const blinkAge = time - blinkTimer;
                        if (blinkAge < 0.15) { // 0.15秒でまばたき
                            eyeScaleY = Math.abs(Math.sin(blinkAge / 0.15 * Math.PI - Math.PI/2)); 
                        } else {
                            isBlinking = false;
                            nextBlinkTime = time + 2.5 + Math.random() * 2.0; // ランダムで2.5〜4.5秒後に次回
                        }
                    }

                    // 🌟 5. メッシュ＆スケール適用（目パチ時の垂直マイクロスケール振動）
                    if (hoshioMesh) {
                        hoshioMesh.rotation.y = rotateY;
                        hoshioMesh.rotation.z = cartwheelRotationZ + tiltZ;
                        
                        const baseS = hoshioConfig.absoluteScale * spawnScale;
                        // 目パチ中にY軸方向へわずかに極小プレスをかけて瞬きを表現！
                        hoshioMesh.scale.set(baseS, baseS * (0.93 + eyeScaleY * 0.07), baseS);
                    }

                    log(isSpeaking ? '🗣️ 口パク・トーク中！' : (isBlinking ? '😉 目パチ（ブリンク）！' : `v0.81: ${hoshioConfig.name} 生体神経パルス稼働中`));
                } else {
                    currentModelGroup.visible = false;
                    isSpawned = false;
                    isCartwheeling = false;
                    bubbleEl.style.display = 'none';
                }
            } else if (currentModelGroup) {
                currentModelGroup.visible = false;
                isSpawned = false;
                isCartwheeling = false;
                bubbleEl.style.display = 'none';
                log('手のひらをかざして下さい✋️');
            }
            renderer.render(scene, camera);
        });

        const cam = new Camera(video, {
            onFrame: async () => { await hands.send({ image: video }); },
            width: 640, height: 480, facingMode: 'environment'
        });
        cam.start().then(() => log('稼働中: 手のひらをかざして下さい✋️'));
    }
</script>
</body>
</html>
