<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ElekiNail AR - Ver.0.78 Hoshio 2.5D Single Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; position: fixed; width: 100%; height: 100%; }
        #webcam { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; transform: scaleX(1) !important; }
        #ar-canvas { position: absolute; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        #start-btn {
            position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%);
            padding: 18px 40px; font-size: 18px; font-weight: bold; color: #fff;
            background: linear-gradient(45deg, #ffcc00, #ff0055); border: none; border-radius: 50px; z-index: 100;
            box-shadow: 0 0 15px #ffcc00; cursor: pointer;
        }
        #status {
            position: absolute; top: 10px; left: 10px; color: #ffcc00; background: rgba(0,0,0,0.7);
            padding: 10px; font-size: 12px; z-index: 1000; border-radius: 5px;
        }
    </style>
</head>
<body>
    <video id="webcam" autoplay playsinline></video>
    <canvas id="ar-canvas"></canvas>
    <div id="status">ステータス: 準備完了。ボタンを押してください。</div>
    <button id="start-btn" onclick="initAR()">ホシオくんを手のひらに召喚！</button>

<script>
    let currentModelGroup = null, scene, camera, renderer, clock, hands;
    let hoshioMesh = null;
    const statusEl = document.getElementById('status');

    function log(msg) { statusEl.innerText = `ステータス: ${msg}`; }
    window.onerror = (e) => log(`エラー発生: ${e}`);

    // 🐾 ホシオくん専用・2.5Dアクスタ設定
    const hoshioConfig = {
        path: './hoshio.png',
        name: 'ホシオくん',
        absoluteScale: 0.65, // 手のひらにジャストフィットするサイズ
        offsetY: -0.15       // 足元（ブーツ）が手のひらに接する位置調整
    };

    async function initAR() {
        document.getElementById('start-btn').style.display = 'none';
        log('施術開始: ホシオくん細胞をロード中...');

        const video = document.getElementById('webcam');
        clock = new THREE.Clock();

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 1.8);

        renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('ar-canvas'), alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // 2.5Dアクスタ用の環境光
        scene.add(new THREE.AmbientLight(0xffffff, 2.0));

        currentModelGroup = new THREE.Group();
        scene.add(currentModelGroup);

        // 🌟 施術1: 2.5D アクリルスタンド化ロジック
        const textureLoader = new THREE.TextureLoader();
        textureLoader.load(
            hoshioConfig.path, 
            (texture) => {
                // 画像のアスペクト比に合わせて板ポリゴンを生成（幅0.75 : 高さ1.0）
                const geometry = new THREE.PlaneGeometry(0.75, 1.0);
                const material = new THREE.MeshBasicMaterial({ 
                    map: texture, 
                    transparent: true, 
                    side: THREE.DoubleSide // 両面描画でアクスタ感演出
                });
                
                hoshioMesh = new THREE.Mesh(geometry, material);
                
                const s = hoshioConfig.absoluteScale;
                hoshioMesh.scale.set(s, s, s);
                currentModelGroup.add(hoshioMesh);
                
                setupModelGroup();
            }, 
            undefined, 
            (err) => log(`【エラー】${hoshioConfig.path} が見つかりません。arフォルダに配置してください。`)
        );

        function setupModelGroup() {
            currentModelGroup.visible = false;
            log(`${hoshioConfig.name} 施術完了！手のひらをかざして下さい✋️`);
            startCamera(video);
        }
    }

    function startCamera(video) {
        hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6 });
        
        hands.onResults((results) => {
            if (currentModelGroup && results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const lm = results.multiHandLandmarks[0];
                
                // 手のひら開閉判定
                const handBase = Math.sqrt(Math.pow(lm[9].x - lm[0].x, 2) + Math.pow(lm[9].y - lm[0].y, 2));
                const fingerLength = Math.sqrt(Math.pow(lm[12].x - lm[0].x, 2) + Math.pow(lm[12].y - lm[0].y, 2));
                const stretchRatio = fingerLength / handBase;

                if (stretchRatio > 1.45) {
                    currentModelGroup.visible = true;
                    
                    // 手のひら（Landmark 9）の中心に追従
                    const x = (lm[9].x - 0.5) * 2.2;
                    const dynamicOffsetY = -(lm[9].y - 0.5) * 3.0 + hoshioConfig.offsetY;
                    
                    currentModelGroup.position.set(x, dynamicOffsetY, 0);
                    log(`v0.78: ${hoshioConfig.name} 手のひらに受肉中！`);
                } else {
                    currentModelGroup.visible = false;
                }
            } else if (currentModelGroup) {
                currentModelGroup.visible = false;
                log('手のひらをかざして下さい✋️');
            }
            renderer.render(scene, camera);
        });

        const cam = new Camera(video, {
            onFrame: async () => { await hands.send({ image: video }); },
            width: 640, height: 480, facingMode: 'environment'
        });
        cam.start().then(() => log('稼働中: 手のひらをかざして下さい✋️'));
    }
</script>
</body>
</html>
