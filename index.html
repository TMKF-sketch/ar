<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ElekiNail AR</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
    }
    #camera-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: none;
      z-index: 1;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      padding: 20px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 15, 25, 0.75);
      backdrop-filter: blur(10px);
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid rgba(0, 255, 200, 0.3);
      box-shadow: 0 4px 20px rgba(0, 255, 200, 0.15);
    }
    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #00ffcc;
      text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #00ff88;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #ffaa00;
      box-shadow: 0 0 8px #ffaa00;
    }
    .dot.active {
      background-color: #00ff88;
      box-shadow: 0 0 8px #00ff88;
    }
    .hint-bar {
      font-size: 11px;
      color: #778899;
      text-align: center;
      background: rgba(10, 15, 25, 0.6);
      padding: 8px 16px;
      border-radius: 20px;
      align-self: center;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.0/lib/three-vrm.module.js"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <video id="camera-video" playsinline webkit-playsinline></video>
  <div id="canvas-container"></div>

  <div id="ui-overlay">
    <div class="header-bar">
      <div class="brand-title">ELEKINAIL : AR DEMO</div>
      <div class="status-indicator">
        <span id="load-status">LOADING...</span>
        <div id="status-dot" class="dot"></div>
      </div>
    </div>

    <div class="hint-bar" id="hint-text">
      カメラに手のひらをかざしてください
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

    let scene, camera, renderer;
    let currentVrm = null;
    let clock = new THREE.Clock();
    const baseScale = 0.65;

    // パラメータ判定
    const urlParams = new URLSearchParams(window.location.search);
    const charParam = urlParams.get('char');
    const vParam = urlParams.get('v');
    const explicitVrm = urlParams.get('vrm');

    // 候補パスリスト（存在するものから順にロード）
    let candidateUrls = [];
    if (explicitVrm) {
      candidateUrls.push(explicitVrm);
    } else if (charParam === 'hoshio' || charParam === 'hoshiokun' || vParam === '88' || vParam === '90') {
      candidateUrls.push('./hoshiokun.vrm', './hoshio.vrm', './avatar.vrm');
    } else if (charParam) {
      candidateUrls.push(`./${charParam}.vrm`, './avatar.vrm');
    } else {
      candidateUrls.push('./hoshiokun.vrm', './hoshio.vrm', './avatar.vrm');
    }

    function initThree() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 20);
      camera.position.set(0, 0, 2.0); // 正面中央を捉える位置

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(0, 2.0, 1.5);
      scene.add(dirLight);

      tryLoadCandidates(0);
      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function tryLoadCandidates(index) {
      if (index >= candidateUrls.length) {
        document.getElementById('load-status').innerText = "VRM NOT FOUND";
        return;
      }

      const targetUrl = candidateUrls[index];
      const loader = new GLTFLoader();
      loader.register((parser) => new VRMLoaderPlugin(parser));

      loader.load(
        targetUrl,
        (gltf) => {
          const vrm = gltf.userData.vrm;
          VRMUtils.removeUnnecessaryVertices(gltf.scene);
          VRMUtils.removeUnnecessaryJoints(gltf.scene);

          currentVrm = vrm;
          scene.add(vrm.scene);

          vrm.scene.rotation.y = Math.PI; // 正面向き
          // 初期位置：画面中央に表示させておく（手認識前でも見えるようにする）
          vrm.scene.position.set(0, -0.4, 0);
          vrm.scene.scale.set(baseScale, baseScale, baseScale);

          document.getElementById('load-status').innerText = "READY";
          document.getElementById('status-dot').className = "dot active";
        },
        undefined,
        (error) => {
          console.warn(`Failed to load ${targetUrl}, trying next...`);
          tryLoadCandidates(index + 1);
        }
      );
    }

    // MediaPipe Hand Tracking Setup
    const videoElement = document.getElementById('camera-video');

    function initHandTracking() {
      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      hands.onResults((results) => {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          const landmarks = results.multiHandLandmarks[0];
          const palmCenter = landmarks[9]; // 中指付け根

          if (currentVrm) {
            // 背面カメラ用の手追従座標（画面内に綺麗に収まるマッピング）
            const targetX = (palmCenter.x - 0.5) * 2.0;
            const targetY = (0.5 - palmCenter.y) * 1.8 - 0.2;
            const targetZ = (palmCenter.z || 0) * -1.2;

            currentVrm.scene.position.x += (targetX - currentVrm.scene.position.x) * 0.25;
            currentVrm.scene.position.y += (targetY - currentVrm.scene.position.y) * 0.25;
            currentVrm.scene.position.z += (targetZ - currentVrm.scene.position.z) * 0.25;
          }
        }
      });

      const cameraFeed = new Camera(videoElement, {
        onFrame: async () => {
          await hands.send({ image: videoElement });
        },
        width: 1280,
        height: 720,
        facingMode: 'environment'
      });

      cameraFeed.start();
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (currentVrm) {
        currentVrm.update(delta);
      }
      renderer.render(scene, camera);
    }

    initThree();
    animate();
    initHandTracking();
  </script>
</body>
</html>
