<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ElekiNail AR - Ver.0.72 Absolute Auto Bounding Box</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@0.6.7/lib/three-vrm.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; position: fixed; width: 100%; height: 100%; }
        #webcam { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; transform: scaleX(1) !important; }
        #ar-canvas { position: absolute; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        #start-btn {
            position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%);
            padding: 18px 40px; font-size: 18px; font-weight: bold; color: #fff;
            background: linear-gradient(45deg, #00ffcc, #0077ff); border: none; border-radius: 50px; z-index: 100;
            box-shadow: 0 0 15px #00ffcc;
        }
        #status {
            position: absolute; top: 10px; left: 10px; color: #00ffcc; background: rgba(0,0,0,0.7);
            padding: 10px; font-size: 12px; z-index: 1000; border-radius: 5px;
        }
    </style>
</head>
<body>
    <video id="webcam" autoplay playsinline></video>
    <canvas id="ar-canvas"></canvas>
    <div id="status">ステータス: 準備完了。ボタンを押してください。</div>
    <button id="start-btn" onclick="initAR()">アニマルAIを召喚する！</button>

<script>
    let currentVrm = null, currentModelGroup = null, scene, camera, renderer, clock, hands;
    const statusEl = document.getElementById('status');

    function log(msg) { statusEl.innerText = `ステータス: ${msg}`; }

    window.onerror = (e) => log(`エラー発生: ${e}`);

    // 🐾 1. URLから ?char=xxx パラメータを取得
    const urlParams = new URLSearchParams(window.location.search);
    const charType = urlParams.get('char') || 'kamui';

    // 🐾 2. Ver.0.72 「目標とする絶対高さ(targetHeight)」による超強力自動スケーリング
    const animalModelMap = {
        'tanuki': { path: './tanuki.glb', type: 'glb', name: 'たぬき',           targetHeight: 0.35, offsetY: -0.15, flipY: false },
        'shark':  { path: './shark.glb',  type: 'glb', name: 'サメ',             targetHeight: 0.45, offsetY:  0.05, flipY: false },
        'kamui':  { path: './kamui.vrm',  type: 'vrm', name: 'カムイ(モモンガ)', targetHeight: 0.40, offsetY:  0.00, flipY: false },
        'owl':    { path: './owl.glb',    type: 'glb', name: 'フクロウ',         targetHeight: 0.35, offsetY: -0.10, flipY: true  }, // 🎯 正面を向かせるため180度反転フラグ
        'default':{ path: './kamui.vrm',  type: 'vrm', name: 'カムイ(モモンガ)', targetHeight: 0.40, offsetY:  0.00, flipY: false }
    };

    const targetAnimal = animalModelMap[charType] || animalModelMap['default'];

    async function initAR() {
        document.getElementById('start-btn').style.display = 'none';
        log('初期化中...');

        const video = document.getElementById('webcam');
        clock = new THREE.Clock();

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 1.8);

        renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('ar-canvas'), alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const mainLight = new THREE.DirectionalLight(0xffffff, 1.8);
        mainLight.position.set(1, 2, 1).normalize();
        scene.add(mainLight);
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));

        log(`${targetAnimal.name} (${targetAnimal.path}) をロード中...`);
        const loader = new THREE.GLTFLoader();
        
        loader.load(
            targetAnimal.path,
            (gltf) => {
                log('モデル構築＆自動バウンディング計算中...');
                
                currentModelGroup = new THREE.Group();
                scene.add(currentModelGroup);

                if (targetAnimal.type === 'vrm') {
                    const vrmLib = (typeof vrm !== 'undefined') ? vrm.VRM : THREE.VRM;
                    vrmLib.from(gltf).then((vrmObj) => {
                        currentVrm = vrmObj;
                        normalizeAndAdd(vrmObj.scene);
                        setupModelGroup();
                    }).catch(err => log(`VRM変換失敗: ${err.message}`));
                } else {
                    currentVrm = null;
                    normalizeAndAdd(gltf.scene);
                    setupModelGroup();
                }
            },
            (progress) => log(`ロード中: ${Math.round(progress.loaded / progress.total * 100)}%`),
            (error) => log(`ロード失敗: ${targetAnimal.path} が見つかりません。`)
        );

        // 🎯 慎重かつ大胆：モデルの元の大きさを完全計測し、目標サイズへ強制バインド！
        function normalizeAndAdd(modelScene) {
            // 1. デフォルト向きの調整
            if (targetAnimal.flipY) {
                modelScene.rotation.y = 0; // 反転
            } else {
                modelScene.rotation.y = Math.PI; // 通常正面
            }

            // 2. バウンディングボックス（立体の外接箱）を精密計測
            const bbox = new THREE.Box3().setFromObject(modelScene);
            const size = new THREE.Vector3();
            bbox.getSize(size);

            // 元のモデルの高さ（Y軸サイズ）を取得
            const currentHeight = size.y > 0 ? size.y : 1.0;
            
            // 3. 目標の高さ（targetHeight）に収める倍率を自動算出！
            const autoScale = targetAnimal.targetHeight / currentHeight;

            // 4. メッシュ全体に強制スケール適用
            modelScene.scale.set(autoScale, autoScale, autoScale);
            
            currentModelGroup.add(modelScene);
            log(`自動サイズ最適化完了！(倍率: ${autoScale.toFixed(4)})`);
        }

        function setupModelGroup() {
            currentModelGroup.visible = false;
            log(`${targetAnimal.name} 受肉完了！Ver.0.72 カメラ起動`);
            startCamera(video);
        }
    }

    function startCamera(video) {
        hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6 });
        
        hands.onResults((results) => {
            const delta = clock.getDelta();
            if (currentModelGroup && results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const lm = results.multiHandLandmarks[0];
                
                const handBase = Math.sqrt(
                    Math.pow(lm[9].x - lm[0].x, 2) + 
                    Math.pow(lm[9].y - lm[0].y, 2)
                );

                const fingerLength = Math.sqrt(
                    Math.pow(lm[12].x - lm[0].x, 2) + 
                    Math.pow(lm[12].y - lm[0].y, 2)
                );

                const stretchRatio = fingerLength / handBase;
                log(`v0.72: ${targetAnimal.name} (手のひら接地中)`);

                if (stretchRatio > 1.45) {
                    currentModelGroup.visible = true;
                    
                    const x = (lm[9].x - 0.5) * 2.2;
                    
                    // 🚨 掌心絶対接地＋モデルごとオフセット
                    const heightMultiplier = 0.1; 
                    const baseOffsetY = -(lm[9].y - 0.5) * 3.0 + (handBase * heightMultiplier);
                    const finalOffsetY = baseOffsetY + targetAnimal.offsetY;
                    
                    currentModelGroup.position.set(x, finalOffsetY, 0);

                    if (currentVrm) {
                        currentVrm.update(delta);
                    }
                } else {
                    currentModelGroup.visible = false;
                }
            } else if (currentModelGroup) {
                currentModelGroup.visible = false;
                log('手のひらをかざして下さい✋️');
            }
            renderer.render(scene, camera);
        });

        const cam = new Camera(video, {
            onFrame: async () => { await hands.send({ image: video }); },
            width: 640, height: 480, facingMode: 'environment'
        });
        cam.start().then(() => log('稼働中: 手のひらをかざして下さい✋️'));
    }
</script>
</body>
</html>
