<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palm AI Gate</title>
    <style>
        body {
            background-color: #000;
            color: #00ffcc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container { text-align: center; }
        .pulse {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            animation: blink 1.2s infinite alternate;
        }
        @keyframes blink { 0% { opacity: 0.3; } 100% { opacity: 1.0; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="pulse" id="status">召喚ゲート展開中...</div>
    </div>

<script>
    // ⚙️ 「IC管理表」のスプレッドシートIDをセット済！
    const SPREADSHEET_ID = "1hr3lUCfSuIAVerCVunJRqrgKK5PmwVDdAuIDDMeTXAg";
    
    // デフォルト（バックアップ）の転送先
    const DEFAULT_URL = "https://tmkf-sketch.github.io/ar/?v=62";

    async function redirect() {
        const urlParams = new URLSearchParams(window.location.search);
        const cardId = urlParams.get('id') || 'red';

        // スプレッドシートからgviz API経由でリアルタイム取得
        const gvizUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json`;

        try {
            const response = await fetch(gvizUrl);
            const text = await response.text();
            
            // Google Visualization APIのJSON化
            const jsonData = JSON.parse(text.substr(47).slice(0, -2));
            const rows = jsonData.table.rows;

            let targetUrl = "";

            // スプレッドシートの各行を検索
            for (let i = 0; i < rows.length; i++) {
                const row = rows[i].c;
                if (!row || !row[0]) continue;

                const rowId = row[0] ? String(row[0].v).trim() : "";
                const rowUrl = row[1] ? String(row[1].v).trim() : "";
                const rowStatus = row[2] ? String(row[2].v).trim() : "active";

                if (rowId === cardId && (rowStatus === 'active' || rowStatus === '')) {
                    targetUrl = rowUrl;
                    break;
                }
            }

            // 見つかったURL、無ければデフォルトへワープ
            window.location.href = targetUrl || DEFAULT_URL;

        } catch (error) {
            console.error("Spreadsheet sync error:", error);
            // エラー時は安全にデフォルトURLへ飛ぶ
            window.location.href = DEFAULT_URL;
        }
    }

    // 実行
    redirect();
</script>
</body>
</html>
