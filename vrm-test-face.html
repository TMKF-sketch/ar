<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ElekiNail - Face & Sick Moves Portal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { overflow: hidden; background-color: #000; font-family: -apple-system, sans-serif; width: 100vw; height: 100dvh; }
    
    #camera-video { position: absolute; top: 0; left: 0; width: 100vw; height: 100dvh; object-fit: cover; z-index: 1; }
    #webgl-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: 2; pointer-events: none; }
    
    #loading-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ffcc; font-family: monospace; font-size: 20px; z-index: 9999; font-weight: bold; text-shadow: 0 0 10px rgba(0,255,204,0.5); white-space: pre-wrap; text-align: center;}

    /* VER 1.2.19: LAST MEMORY */
    #version-text {
      position: absolute; top: 20px; right: 20px; color: #ffdd00; font-family: monospace; font-size: 14px; 
      font-weight: 900; background: rgba(0,0,0,0.8); padding: 5px 10px; border-radius: 5px; z-index: 9999; border: 2px solid #ffdd00;
      box-shadow: 0 0 15px rgba(255,221,0,0.8);
    }

    #status-text { position: absolute; top: 20px; left: 20px; color: #fff; font-family: monospace; font-size: 14px; text-shadow: 1px 1px 2px #000; z-index: 9999; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 5px;}

    #ui-layer { position: absolute; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: 1000; pointer-events: none; }
    
    #portal-ui {
      position: absolute; bottom: calc(40px + env(safe-area-inset-bottom)); width: 100%; display: flex; justify-content: space-evenly;
      transition: opacity 0.3s ease; opacity: 0; pointer-events: none;
    }
    #portal-ui.active { opacity: 1; pointer-events: auto; }
    .btn { background: rgba(0, 255, 204, 0.9); color: #000; padding: 15px 20px; border-radius: 30px; font-weight: 900; box-shadow: 0 4px 15px rgba(0,255,204,0.6); font-size: 14px;}

    #showstage-ui {
      position: absolute; bottom: calc(40px + env(safe-area-inset-bottom)); right: 30px;
      transition: opacity 0.3s ease; opacity: 0; pointer-events: none;
    }
    #showstage-ui.active { opacity: 1; pointer-events: auto; }
    .btn-snap { background: rgba(255, 0, 85, 0.9); color: white; padding: 15px 25px; border-radius: 30px; font-weight: 900; box-shadow: 0 4px 15px rgba(255,0,85,0.6); font-size: 16px;}
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <video id="camera-video" playsinline webkit-playsinline></video>
  <canvas id="webgl-canvas"></canvas>
  
  <div id="loading-text">KAMUI BOOTING...</div>
  <div id="status-text">WAITING FOR HAND...</div>
  <div id="version-text">VER 1.2.19: LAST MEMORY</div>

  <div id="ui-layer">
    <div id="portal-ui">
      <div class="btn">🗣️ TALK</div>
      <div class="btn">✨ INVITE</div>
      <div class="btn">💅 RSRV</div>
    </div>
    <div id="showstage-ui">
      <div class="btn-snap">📸 SNAP</div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.154.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.154.0/examples/jsm/",
        "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@2.0.6/lib/three-vrm.module.js"
      }
    }
  </script>

  <script type="module">
    console.log("SYSTEM START: Modules loading...");

    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VRMLoaderPlugin } from '@pixiv/three-vrm';

    const portalUI = document.getElementById('portal-ui');
    const showStageUI = document.getElementById('showstage-ui');
    const statusText = document.getElementById('status-text');
    
    let currentMode = 'NONE';
    let lastValidMode = 'PALM'; // 🚀 ロストする直前の状態を記憶する変数
    
    let currentGesture = 'NONE';
    let isSpinning = false;
    let wasSpinning = false;
    let spinAngle = 0;
    let jumpOffset = 0;
    let headbangTime = 0;
    let palmConfidence = 0; 

    const canvas = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputColorSpace = THREE.SRGBColorSpace; 

    const scene = new THREE.Scene();
    const v3dCamera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    v3dCamera.position.set(0, 0, 1.5); 

    const light = new THREE.DirectionalLight(0xffffff, 1.2);
    light.position.set(1.5, 0.5, 1).normalize();
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.1));

    let currentVrm = null;

    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));

    loader.load('./kamui_face.vrm', (gltf) => {
        try {
            const vrm = gltf.userData.vrm;
            if (!vrm) throw new Error("VRM data not found in file.");
            currentVrm = vrm;
            scene.add(vrm.scene);
            
            vrm.scene.scale.set(0.6, 0.6, 0.6); 
            vrm.scene.rotation.y = Math.PI; 
            vrm.scene.position.set(0, -10, 0); 

            document.getElementById('loading-text').style.display = 'none';
            console.log('Kamuiオンライン。ラスト・メモリー防壁稼働完了。');
        } catch(e) {
            console.error("VRM Initialization Error:", e);
            document.getElementById('loading-text').innerText = "FATAL ERROR\nSEE CONSOLE";
            document.getElementById('loading-text').style.color = "#ff0000";
        }
    }, undefined, (error) => {
        console.error("VRM Load Error:", error);
        document.getElementById('loading-text').innerText = "ERROR: VRM LOAD FAILED.\nPLEASE RELOAD.";
        document.getElementById('loading-text').style.color = "#ff0055";
    });

    function setExpression(expName, value) {
      try {
        if (currentVrm && currentVrm.expressionManager) {
          const exp = currentVrm.expressionManager.getExpression(expName);
          if (exp) currentVrm.expressionManager.setValue(expName, value);
        }
      } catch(e) { }
    }

    const clock = new THREE.Clock();
    
    function animate() {
      requestAnimationFrame(animate);
      
      try {
        if (currentVrm) {
          const delta = clock.getDelta();
          
          if (isSpinning) {
            spinAngle += 0.3; 
            currentVrm.scene.rotation.y = Math.PI + spinAngle;
            jumpOffset = Math.sin(spinAngle / 2) * 0.4; 
            
            if (spinAngle >= Math.PI * 2) {
              isSpinning = false; 
              spinAngle = 0;
              jumpOffset = 0;
              currentVrm.scene.rotation.y = Math.PI; 
            }
          }

          if (currentGesture === 'ROCKON') {
            headbangTime += delta * 15;
            const headNode = currentVrm.humanoid.getNormalizedBoneNode('head');
            if (headNode) headNode.rotation.z = Math.sin(headbangTime) * 0.5;
          } else {
            const headNode = currentVrm.humanoid.getNormalizedBoneNode('head');
            if (headNode) headNode.rotation.z = 0;
          }

          currentVrm.update(delta);
        }
        
        renderer.render(scene, v3dCamera);
      } catch(e) {
        console.error("Render Loop Error:", e);
      }
    }
    animate();

    function forceLostState() {
        try {
            if(currentVrm) {
                currentVrm.scene.position.set(0, -10, 0); 
                const headNode = currentVrm.humanoid?.getNormalizedBoneNode('head');
                if (headNode) headNode.rotation.z = 0;
                setExpression('happy', 0.0); setExpression('Joy', 0.0);
                setExpression('angry', 0.0); setExpression('Angry', 0.0);
            }
            portalUI.classList.remove('active');
            showStageUI.classList.remove('active');
            
            if (currentMode !== 'NONE') {
                // 🚀 【消滅時の状態保存】ロストする瞬間に「PALMだったかBACKだったか」を記録する
                lastValidMode = currentMode;
                
                currentMode = 'NONE';
                currentGesture = 'NONE';
                isSpinning = false;
                wasSpinning = false;
                palmConfidence = 0; 
                statusText.innerText = "WAITING FOR HAND...";
                statusText.style.color = "#fff";
            }
        } catch(e) {
            console.error("Lost State Error:", e);
        }
    }

    const videoElement = document.getElementById('camera-video');
    const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });

    hands.onResults((results) => {
      try {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0 && currentVrm) {
          const landmarks = results.multiHandLandmarks[0];
          const handedness = results.multiHandedness[0].label;
          
          const p0 = landmarks[0], p5 = landmarks[5], p9 = landmarks[9], p17 = landmarks[17]; 

          const lenY = Math.hypot(p9.x - p0.x, p9.y - p0.y);
          const lenX = Math.hypot(p17.x - p5.x, p17.y - p5.y);
          const squashRatio = lenY / (lenX + 0.0001);

          // キルスイッチ (55%未満でロスト)
          if (squashRatio < 0.55) {
              forceLostState();
              return; 
          }

          let uiNeedsUpdate = false; 

          const v5 = { x: p5.x - p0.x, y: p5.y - p0.y, z: p5.z - p0.z }; 
          const v17 = { x: p17.x - p0.x, y: p17.y - p0.y, z: p17.z - p0.z }; 
          
          const nx = v5.y * v17.z - v5.z * v17.y;
          const ny = v5.z * v17.x - v5.x * v17.z;
          const nz = v5.x * v17.y - v5.y * v17.x; 
          
          const nMag = Math.sqrt(nx * nx + ny * ny + nz * nz);
          const normalizedNz = nz / (nMag + 0.00001); 
          const checkValue = (handedness === 'Right') ? normalizedNz : -normalizedNz;

          let isPalm = currentMode === 'PALM';

          if (currentMode === 'NONE') {
              // 🚀 【復帰時の強制記憶上書き（ラスト・メモリー）】
              // 潰れた状態（85%未満）で戻ってきた時は、カメラの計算をガン無視し、
              // 「ロストする直前の状態（lastValidMode）」で強制的に復帰させる！
              if (squashRatio < 0.85) {
                  isPalm = (lastValidMode === 'PALM');
              } else {
                  isPalm = checkValue > 0;
              }
              palmConfidence = isPalm ? 10 : -10;
          } else {
              if (squashRatio >= 0.85) {
                  if (checkValue > 0.3) palmConfidence += 3;
                  else if (checkValue < -0.3) palmConfidence -= 3;
              }
              
              palmConfidence = Math.max(-10, Math.min(10, palmConfidence));

              if (palmConfidence >= 8) isPalm = true;
              else if (palmConfidence <= -8) isPalm = false;
          }

          const newMode = isPalm ? 'PALM' : 'BACK';
          if (currentMode !== newMode) {
            currentMode = newMode;
            uiNeedsUpdate = true;
            
            if (isPalm) {
              portalUI.classList.add('active');
              showStageUI.classList.remove('active');
            } else {
              portalUI.classList.remove('active');
              showStageUI.classList.add('active');
            }
          }

          const isIndexUp = landmarks[8].y < landmarks[5].y;
          const isMiddleUp = landmarks[12].y < landmarks[9].y;
          const isRingUp = landmarks[16].y < landmarks[13].y;
          const isPinkyUp = landmarks[20].y < landmarks[17].y;

          let detectedGesture = 'NONE';
          if (isIndexUp && isMiddleUp && !isRingUp && !isPinkyUp) detectedGesture = 'PEACE'; 
          else if (isIndexUp && !isMiddleUp && !isRingUp && isPinkyUp) detectedGesture = 'ROCKON'; 
          else if (!isIndexUp && !isMiddleUp && !isRingUp && !isPinkyUp) detectedGesture = 'FIST'; 
          else if (isIndexUp && isMiddleUp && isRingUp && isPinkyUp) detectedGesture = 'PAPER'; 

          if (currentGesture !== detectedGesture) {
            uiNeedsUpdate = true; 

            setExpression('happy', 0.0); setExpression('Joy', 0.0);
            setExpression('angry', 0.0); setExpression('Angry', 0.0);
            setExpression('blinkLeft', 0.0); setExpression('Blink_L', 0.0);

            if (currentGesture === 'FIST' && detectedGesture === 'PAPER' && !isSpinning) {
              isSpinning = true;
            } 
            else if (detectedGesture === 'PEACE') {
              setExpression('happy', 1.0);
              setExpression('Joy', 1.0); 
            } 
            else if (detectedGesture === 'ROCKON') {
              setExpression('angry', 1.0);
              setExpression('Angry', 1.0);
              headbangTime = 0; 
            }
            currentGesture = detectedGesture;
          }

          if (isSpinning !== wasSpinning) {
              uiNeedsUpdate = true;
              wasSpinning = isSpinning;
          }

          if (uiNeedsUpdate) {
            if (isSpinning) {
              statusText.innerText = "SICK MOVE: MJ SPIN!!";
              statusText.style.color = "#ffdd00";
            } 
            else if (currentGesture === 'PEACE') {
              statusText.innerText = "SICK MOVE: IDOL SMILE!";
              statusText.style.color = "#ffdd00";
            } 
            else if (currentGesture === 'ROCKON') {
              statusText.innerText = "SICK MOVE: ROCKSTAR!!";
              statusText.style.color = "#ff0055";
            } 
            else {
              statusText.innerText = "MODE: " + currentMode;
              statusText.style.color = (currentMode === 'PALM') ? "#00ffcc" : "#ff0055";
            }
          }

          const palmCenterX = (p5.x + p17.x) / 2;
          const palmCenterY = (p5.y + p17.y) / 2;
          const centerX = (landmarks[0].x * 0.4) + (palmCenterX * 0.6);
          const centerY = (landmarks[0].y * 0.4) + (palmCenterY * 0.6);

          const ndcX = (centerX - 0.5) * 2; 
          const ndcY = -(centerY - 0.5) * 2;

          const vec = new THREE.Vector3(ndcX, ndcY, 0.5);
          vec.unproject(v3dCamera);
          vec.sub(v3dCamera.position).normalize();
          const distance = -v3dCamera.position.z / vec.z;
          const targetPos = new THREE.Vector3().copy(v3dCamera.position).add(vec.multiplyScalar(distance));

          currentVrm.scene.position.copy(targetPos);
          currentVrm.scene.position.y += 0.0 + jumpOffset; 

        } else {
          forceLostState();
        }
      } catch(e) {
        console.error("Hands Results Error:", e);
      }
    });

    const camera = new Camera(videoElement, {
      onFrame: async () => { await hands.send({ image: videoElement }); },
      width: 1280, height: 720, facingMode: 'environment' 
    });
    camera.start();

    window.addEventListener('resize', () => {
      v3dCamera.aspect = window.innerWidth / window.innerHeight;
      v3dCamera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
