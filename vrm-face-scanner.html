<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Kamui Expression Curator (VER 3.4)</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #111; font-family: -apple-system, monospace; color: #fff; user-select: none; }
    #webgl-canvas { display: block; width: 100vw; height: 100vh; }
    
    #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #00ffcc; font-size: 20px; font-weight: bold; pointer-events: none; z-index: 100;
    }

    #version-text {
      position: absolute; bottom: 20px; right: 20px; color: #ffdd00; font-size: 14px; 
      font-weight: 900; background: rgba(0,0,0,0.8); padding: 5px 10px; border-radius: 5px; z-index: 9999; border: 2px solid #ffdd00;
      box-shadow: 0 0 15px rgba(255,221,0,0.5); pointer-events: none;
    }
    
    /* 🚀 自動生成される全ボタンを格納するコンテナ（スクロール対応） */
    #ui-panel {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8); border: 2px solid #00ffcc; box-shadow: 0 0 20px rgba(0,255,204,0.4);
      padding: 15px; border-radius: 15px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; z-index: 10;
      max-width: 95%; max-height: 250px; overflow-y: auto; backdrop-filter: blur(5px); align-content: flex-start;
    }
    
    .exp-btn {
      background: #222; border: 1px solid #555; color: #ccc;
      padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: bold;
      cursor: pointer; transition: all 0.2s ease; text-transform: uppercase;
    }
    
    .exp-btn:hover { background: #333; border-color: #888; color: #fff; }
    
    .exp-btn.active {
      background: rgba(0, 255, 204, 0.2); border-color: #00ffcc; color: #00ffcc;
      box-shadow: 0 0 10px rgba(0,255,204,0.5);
    }

    #current-id-display {
      position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
      color: #ffdd00; font-size: 16px; font-family: monospace; font-weight: bold;
      background: rgba(0,0,0,0.7); padding: 5px 15px; border-radius: 8px; border: 1px solid #ffdd00;
      pointer-events: none; text-align: center;
    }

    #nav-text {
      position: absolute; bottom: 20px; left: 20px; color: #888; font-size: 12px; 
      pointer-events: none; line-height: 1.4;
    }
    
    /* スクロールバーの装飾 */
    #ui-panel::-webkit-scrollbar { width: 8px; }
    #ui-panel::-webkit-scrollbar-track { background: rgba(0,0,0,0.5); border-radius: 10px; }
    #ui-panel::-webkit-scrollbar-thumb { background: #00ffcc; border-radius: 10px; }
  </style>
</head>
<body>

  <div id="loading">SYSTEM LOADING... EXTRACTING ALL DATA...</div>
  <div id="version-text">VER 3.4: OMNI SCANNER</div>
  
  <div id="nav-text">
    [ CAMERA HACK ]<br>
    ・1指D: 回転 / ピンチ: ズーム / 2指S: パン
  </div>
  <div id="current-id-display">VRM ID: NEUTRAL</div>
  <canvas id="webgl-canvas"></canvas>
  
  <!-- 🚀 ボタンはJavaScriptで自動生成されるため空にしておく -->
  <div id="ui-panel"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.154.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.154.0/examples/jsm/",
        "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@2.0.6/lib/three-vrm.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { VRMLoaderPlugin } from '@pixiv/three-vrm';

    const canvas = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputColorSpace = THREE.SRGBColorSpace; 

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#1a1a1a');

    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.35, 1.0); 

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.35, 0); 
    
    controls.enableZoom = true;
    controls.enablePan = true;
    controls.screenSpacePanning = true; 
    controls.enableDamping = true;
    controls.dampingFactor = 0.1;
    controls.update();

    const light = new THREE.DirectionalLight(0xffffff, 1.5);
    light.position.set(1, 1, 1).normalize();
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));

    let currentVrm = null;
    const idDisplay = document.getElementById('current-id-display');
    const uiPanel = document.getElementById('ui-panel');

    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));

    const vrmPath = './kamui_face.vrm?v=' + Date.now();

    loader.load(vrmPath, (gltf) => {
        const vrm = gltf.userData.vrm;
        currentVrm = vrm;
        scene.add(vrm.scene);
        vrm.scene.rotation.y = Math.PI; 
        
        document.getElementById('loading').style.display = 'none';
        
        // 🚀 【OMNI SCANNER プロトコル】
        // VRM内部に定義されているすべての表情IDを抽出し、ボタンを自動生成する
        if (vrm.expressionManager && vrm.expressionManager.expressions) {
            const expressions = vrm.expressionManager.expressions;
            console.log(`Kamui Expression Curator (VER 3.4) オンライン。全 ${expressions.length} スロットを抽出。`);
            
            // 全ての表情IDに対してボタンを作る
            expressions.forEach((exp, index) => {
                const btn = document.createElement('button');
                btn.className = 'exp-btn';
                if (exp.expressionName === 'neutral') btn.classList.add('active'); // 最初はneutralをアクティブに
                btn.innerText = exp.expressionName;
                
                btn.onclick = () => {
                    applyExactExpression(exp.expressionName, btn);
                };
                uiPanel.appendChild(btn);
            });
        }
        
    }, undefined, (error) => {
        console.error("LOAD ERROR", error);
    });

    // ダイレクトに指定されたIDだけを1.0にする関数
    function applyExactExpression(exactId, btnElement) {
        if (!currentVrm || !currentVrm.expressionManager) return;

        // 一旦すべてリセット
        currentVrm.expressionManager.expressions.forEach(exp => {
            currentVrm.expressionManager.setValue(exp.expressionName, 0.0);
        });

        // 該当のIDだけを1.0にする
        currentVrm.expressionManager.setValue(exactId, 1.0);

        idDisplay.innerText = `VRM ID: ${exactId}`;
        
        const buttons = document.querySelectorAll('.exp-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
    }

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      if (currentVrm) currentVrm.update(clock.getDelta());
      controls.update(); 
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
