<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Kamui Face Scanner</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #222; font-family: -apple-system, monospace; color: #fff; }
    #webgl-canvas { display: block; width: 100vw; height: 100vh; }
    
    #ui-panel {
      position: absolute; top: 0; right: 0; width: 300px; height: 100vh; 
      background: rgba(0, 0, 0, 0.8); overflow-y: auto; padding: 20px; box-sizing: border-box;
      border-left: 2px solid #00ffcc; box-shadow: -5px 0 15px rgba(0,255,204,0.3);
    }
    
    h1 { font-size: 16px; color: #00ffcc; text-align: center; border-bottom: 1px solid #555; padding-bottom: 10px; margin-top: 0; }
    
    .expression-row { margin-bottom: 15px; }
    .expression-label { font-size: 12px; display: flex; justify-content: space-between; margin-bottom: 5px; font-weight: bold; }
    .expression-slider { width: 100%; cursor: pointer; accent-color: #ffdd00; }
    
    #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #00ffcc; font-size: 24px; font-weight: bold; pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="loading">SCANNING VRM DATA...</div>
  <canvas id="webgl-canvas"></canvas>
  
  <div id="ui-panel">
    <h1>EXPRESSION SCANNER</h1>
    <div id="sliders-container"></div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.154.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.154.0/examples/jsm/",
        "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@2.0.6/lib/three-vrm.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { VRMLoaderPlugin } from '@pixiv/three-vrm';

    const canvas = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputColorSpace = THREE.SRGBColorSpace; 

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#333344');

    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.2, 2.5); 

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.2, 0);
    controls.update();

    const light = new THREE.DirectionalLight(0xffffff, 1.2);
    light.position.set(1, 1, 1).normalize();
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));

    let currentVrm = null;

    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));

    loader.load('./kamui_face.vrm', (gltf) => {
        const vrm = gltf.userData.vrm;
        currentVrm = vrm;
        scene.add(vrm.scene);
        
        vrm.scene.rotation.y = Math.PI; 
        
        document.getElementById('loading').style.display = 'none';
        
        // 🚀 【表情リストの自動抽出とUI生成】
        buildExpressionUI(vrm);

    }, undefined, (error) => {
        console.error(error);
        document.getElementById('loading').innerText = "ERROR: LOAD FAILED";
        document.getElementById('loading').style.color = "#ff0055";
    });

    function buildExpressionUI(vrm) {
        const container = document.getElementById('sliders-container');
        if (!vrm.expressionManager) {
            container.innerHTML = "<p style='color:red;'>No Expressions Found.</p>";
            return;
        }

        // VRMに登録されている全ての表情データを配列化
        const expressions = vrm.expressionManager.expressions;
        const expNames = Object.keys(expressions);

        if (expNames.length === 0) {
            container.innerHTML = "<p style='color:red;'>No Expressions Found.</p>";
            return;
        }

        // スライダーを自動生成
        expNames.forEach(name => {
            const row = document.createElement('div');
            row.className = 'expression-row';
            
            const label = document.createElement('div');
            label.className = 'expression-label';
            label.innerHTML = `<span>${name}</span> <span id="val-${name}">0.00</span>`;
            
            const slider = document.createElement('input');
            slider.type = 'range';
            slider.className = 'expression-slider';
            slider.min = 0;
            slider.max = 1;
            slider.step = 0.01;
            slider.value = 0;
            
            slider.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                document.getElementById(`val-${name}`).innerText = val.toFixed(2);
                vrm.expressionManager.setValue(name, val);
            });

            row.appendChild(label);
            row.appendChild(slider);
            container.appendChild(row);
        });
        
        console.log(`抽出完了: ${expNames.length}個の表情を検出しました。`);
    }

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      if (currentVrm) {
        currentVrm.update(clock.getDelta());
      }
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
