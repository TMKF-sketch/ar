<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Kamui Auto Face Scanner</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #222; font-family: -apple-system, monospace; color: #fff; }
    #webgl-canvas { display: block; width: 100vw; height: 100vh; }
    
    #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #00ffcc; font-size: 24px; font-weight: bold; pointer-events: none; z-index: 10;
    }
    
    /* 現在表示中の表情名をデカデカと表示するパネル */
    #expression-display {
      position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7); border: 2px solid #ffdd00; box-shadow: 0 0 20px rgba(255,221,0,0.5);
      padding: 15px 40px; border-radius: 10px; font-size: 32px; font-weight: 900; color: #ffdd00;
      text-align: center; pointer-events: none; display: none; z-index: 10;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div id="loading">SCANNING VRM DATA...</div>
  <div id="expression-display">NEUTRAL</div>
  <canvas id="webgl-canvas"></canvas>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.154.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.154.0/examples/jsm/",
        "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@2.0.6/lib/three-vrm.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { VRMLoaderPlugin } from '@pixiv/three-vrm';

    const canvas = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputColorSpace = THREE.SRGBColorSpace; 

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#333344');

    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
    // 顔がよく見えるようにカメラを少し近づけてセット
    camera.position.set(0, 1.4, 1.5); 

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.4, 0);
    controls.update();

    const light = new THREE.DirectionalLight(0xffffff, 1.2);
    light.position.set(1, 1, 1).normalize();
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));

    let currentVrm = null;
    let expressionNames = [];
    let currentIndex = 0;
    const displayElement = document.getElementById('expression-display');

    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));

    loader.load('./kamui_face.vrm', (gltf) => {
        const vrm = gltf.userData.vrm;
        currentVrm = vrm;
        scene.add(vrm.scene);
        vrm.scene.rotation.y = Math.PI; 
        
        document.getElementById('loading').style.display = 'none';
        displayElement.style.display = 'block';
        
        if (vrm.expressionManager) {
            // 全ての表情名を配列に抽出
            expressionNames = Object.keys(vrm.expressionManager.expressions);
            console.log(`抽出完了: ${expressionNames.length}個の表情を検出。オートプレイを開始します。`);
            
            // 2秒ごとに自動で切り替えるタイマーをセット
            setInterval(playNextExpression, 2000);
            playNextExpression(); // 初回実行
        }

    }, undefined, (error) => {
        console.error(error);
        document.getElementById('loading').innerText = "ERROR: LOAD FAILED";
        document.getElementById('loading').style.color = "#ff0055";
    });

    function playNextExpression() {
        if (!currentVrm || expressionNames.length === 0) return;

        // まず全ての表情を0に戻してリセット（顔が混ざるのを防ぐ）
        expressionNames.forEach(name => {
            currentVrm.expressionManager.setValue(name, 0.0);
        });

        // 次の表情を1.0（MAX）にする
        const currentName = expressionNames[currentIndex];
        currentVrm.expressionManager.setValue(currentName, 1.0);
        
        // 画面に名前をドカンと表示
        displayElement.innerText = currentName;

        // インデックスを進める（最後まで行ったら最初に戻る）
        currentIndex = (currentIndex + 1) % expressionNames.length;
    }

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      if (currentVrm) currentVrm.update(clock.getDelta());
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
