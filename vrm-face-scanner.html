<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Kamui Expression Curator (VER 2.3)</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #111; font-family: -apple-system, monospace; color: #fff; user-select: none; }
    #webgl-canvas { display: block; width: 100vw; height: 100vh; }
    
    #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #00ffcc; font-size: 20px; font-weight: bold; pointer-events: none; z-index: 100;
      text-shadow: 0 0 10px rgba(0,255,204,0.5);
    }
    
    /* キュレーションUIパネル */
    #ui-panel {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8); border: 2px solid #00ffcc; box-shadow: 0 0 20px rgba(0,255,204,0.4);
      padding: 15px; border-radius: 15px; display: flex; gap: 10px; z-index: 10;
      backdrop-filter: blur(5px);
    }
    
    .exp-btn {
      background: #222; border: 1px solid #555; color: #ccc;
      padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: bold;
      cursor: pointer; transition: all 0.2s ease;
      text-transform: uppercase;
    }
    
    .exp-btn:hover { background: #333; border-color: #888; color: #fff; }
    
    /* アクティブな表情ボタンのスタイル */
    .exp-btn.active {
      background: rgba(0, 255, 204, 0.2); border-color: #00ffcc; color: #00ffcc;
      box-shadow: 0 0 10px rgba(0,255,204,0.5);
    }

    #current-id-display {
      position: absolute; bottom: 95px; left: 50%; transform: translateX(-50%);
      color: #ffdd00; font-size: 12px; font-family: monospace;
      pointer-events: none; text-align: center; width: 100%;
    }

    #nav-text {
      position: absolute; top: 20px; left: 20px; color: #888; font-size: 12px; 
      pointer-events: none; line-height: 1.4;
    }
  </style>
</head>
<body>

  <div id="loading">SYSTEM LOADING... ANALYZING VRM...</div>
  <div id="nav-text">
    [ CAMERA HACK ]<br>
    ・1指D: 回転 / ピンチ: ズーム / 2指S: パン
  </div>
  <div id="current-id-display">VRM ID: NEUTRAL</div>
  <canvas id="webgl-canvas"></canvas>
  
  <!-- キュレーションUI -->
  <div id="ui-panel">
    <button class="exp-btn active" onclick="applyCurated('neutral', this)">Neutral</button>
    <button class="exp-btn" onclick="applyCurated('happy', this)">Happy/Joy</button>
    <button class="exp-btn" onclick="applyCurated('surprised', this)">Surprised</button>
    <button class="exp-btn" onclick="applyCurated('angry', this)">Angry</button>
    <button class="exp-btn" onclick="applyCurated('sad', this)">Sad/Sorrow</button>
    <button class="exp-btn" onclick="applyCurated('relaxed', this)">Relaxed/Fun</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.154.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.154.0/examples/jsm/",
        "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@2.0.6/lib/three-vrm.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { VRMLoaderPlugin } from '@pixiv/three-vrm';

    // 🚀 【論理統合プロトコル】
    // ユーザーが指定した感情名に対し、VRM規格差を含めた候補IDリストを定義。
    const EMOTION_WHITELIST = {
      neutral: ['neutral'],
      happy: ['happy', 'joy', 'Joy'],
      surprised: ['surprised', 'Surprised', 'surprise'],
      angry: ['angry', 'Angry'],
      sad: ['sad', 'sorrow', 'Sorrow'],
      relaxed: ['relaxed', 'fun', 'Fun']
    };

    const canvas = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputColorSpace = THREE.SRGBColorSpace; 

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#1a1a1a'); // 少し明るい黒

    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
    // 顔の正面に配置
    camera.position.set(0, 1.35, 1.1); 

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.35, 0); // 顔を注視点にする
    
    // v2.2の快適な操作系を継承
    controls.enableZoom = true;
    controls.enablePan = true;
    controls.screenSpacePanning = true; 
    controls.enableDamping = true;
    controls.dampingFactor = 0.1;
    controls.update();

    // ライティング調整（顔を明るく）
    const light = new THREE.DirectionalLight(0xffffff, 1.5);
    light.position.set(1, 1, 1).normalize();
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));

    let currentVrm = null;
    const idDisplay = document.getElementById('current-id-display');

    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));

    // ファイル名は固定
    loader.load('./kamui_face.vrm', (gltf) => {
        const vrm = gltf.userData.vrm;
        currentVrm = vrm;
        scene.add(vrm.scene);
        vrm.scene.rotation.y = Math.PI; 
        
        document.getElementById('loading').style.display = 'none';
        console.log("Kamui Expression Curator オンライン。");
        
        // グローバル関数として公開し、HTMLのonclickから呼べるようにする
        window.applyCurated = applyCurated;

    }, undefined, (error) => {
        console.error(error);
        document.getElementById('loading').innerText = "FATAL ERROR: LOAD FAILED";
        document.getElementById('loading').style.color = "#ff0055";
    });

    // 🚀 【表情適用コアロジック】
    function applyCurated(emotionKey, btnElement) {
        if (!currentVrm || !currentVrm.expressionManager) return;

        console.log(`Command received: Set emotion to [${emotionKey}]`);

        // 1. まず全ての表情を0.0に戻す（クリーンアッププロトコル）
        currentVrm.expressionManager.expressions.forEach(exp => {
            currentVrm.expressionManager.setValue(exp.expressionName, 0.0);
        });

        // 2. ホワイトリストに基づいて対象の表情を探し、1.0にする
        const targetIds = EMOTION_WHITELIST[emotionKey];
        let appliedId = "NONE (NOT FOUND)";

        if (targetIds) {
            for (const id of targetIds) {
                // モデル内にそのIDが存在するか確認
                const exp = currentVrm.expressionManager.getExpression(id);
                if (exp) {
                    currentVrm.expressionManager.setValue(id, 1.0);
                    appliedId = id;
                    break; // 最初に見つかった候補IDを適用して終了
                }
            }
        }

        // 3. UIアップデート
        // ID表示
        idDisplay.innerText = `VRM ID: ${appliedId}`;
        
        // ボタンのアクティブ状態切り替え
        const buttons = document.querySelectorAll('.exp-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
    }

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      if (currentVrm) currentVrm.update(clock.getDelta());
      controls.update(); 
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
