<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Kamui Expression Curator (VER 3.1)</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #111; font-family: -apple-system, monospace; color: #fff; user-select: none; }
    #webgl-canvas { display: block; width: 100vw; height: 100vh; }
    
    #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #00ffcc; font-size: 20px; font-weight: bold; pointer-events: none; z-index: 100;
    }

    #version-text {
      position: absolute; bottom: 20px; right: 20px; color: #ff0055; font-size: 14px; 
      font-weight: 900; background: rgba(0,0,0,0.8); padding: 5px 10px; border-radius: 5px; z-index: 9999; border: 2px solid #ff0055;
      box-shadow: 0 0 15px rgba(255,0,85,0.5); pointer-events: none;
    }
    
    #ui-panel {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8); border: 2px solid #00ffcc; box-shadow: 0 0 20px rgba(0,255,204,0.4);
      padding: 15px; border-radius: 15px; display: flex; gap: 10px; z-index: 10;
      backdrop-filter: blur(5px);
    }
    
    .exp-btn {
      background: #222; border: 1px solid #555; color: #ccc;
      padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: bold;
      cursor: pointer; transition: all 0.2s ease; text-transform: uppercase;
    }
    
    .exp-btn:hover { background: #333; border-color: #888; color: #fff; }
    
    .exp-btn.active {
      background: rgba(0, 255, 204, 0.2); border-color: #00ffcc; color: #00ffcc;
      box-shadow: 0 0 10px rgba(0,255,204,0.5);
    }

    /* 🚀 【YABAI専用スタイル】危険なオーラを放つボタン */
    .yabai-btn {
      background: #300; border: 1px solid #f00; color: #f55;
    }
    .yabai-btn:hover { background: #500; border-color: #f55; color: #fff; }
    .yabai-btn.active {
      background: rgba(255, 0, 0, 0.4); border-color: #ff0000; color: #ff0000;
      box-shadow: 0 0 15px rgba(255,0,0,0.8); font-weight: 900;
    }

    #current-id-display {
      position: absolute; top: 90px; left: 50%; transform: translateX(-50%);
      color: #ffdd00; font-size: 14px; font-family: monospace; font-weight: bold;
      pointer-events: none; text-align: center; width: 100%;
    }

    #nav-text {
      position: absolute; bottom: 20px; left: 20px; color: #888; font-size: 12px; 
      pointer-events: none; line-height: 1.4;
    }
  </style>
</head>
<body>

  <div id="loading">SYSTEM LOADING... ANALYZING PURE DATA...</div>
  <div id="version-text">VER 3.1: CHIMERA MIX</div>
  
  <div id="nav-text">
    [ CAMERA HACK ]<br>
    ・1指D: 回転 / ピンチ: ズーム / 2指S: パン
  </div>
  <div id="current-id-display">VRM ID: NEUTRAL</div>
  <canvas id="webgl-canvas"></canvas>
  
  <div id="ui-panel">
    <button class="exp-btn active" onclick="applyCurated('neutral', this)">Neutral</button>
    <button class="exp-btn" onclick="applyCurated('happy', this)">Happy/Joy</button>
    <button class="exp-btn" onclick="applyCurated('surprised', this)">Surprised</button>
    <button class="exp-btn" onclick="applyCurated('sad', this)">Sad/Sorrow</button>
    <!-- 🚀 ヤバい表情ボタンを追加 -->
    <button class="exp-btn yabai-btn" onclick="applyCurated('sick', this)">⚠️ SICK (ヤバい顔)</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.154.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.154.0/examples/jsm/",
        "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@2.0.6/lib/three-vrm.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { VRMLoaderPlugin } from '@pixiv/three-vrm';

    const EMOTION_WHITELIST = {
      neutral: ['neutral'],
      happy: ['happy', 'joy', 'Joy'],
      surprised: ['surprised', 'Surprised', 'surprise'],
      sad: ['sad', 'sorrow', 'Sorrow']
    };

    const canvas = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputColorSpace = THREE.SRGBColorSpace; 

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#1a1a1a');

    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.35, 1.1); 

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.35, 0); 
    
    controls.enableZoom = true;
    controls.enablePan = true;
    controls.screenSpacePanning = true; 
    controls.enableDamping = true;
    controls.dampingFactor = 0.1;
    controls.update();

    const light = new THREE.DirectionalLight(0xffffff, 1.5);
    light.position.set(1, 1, 1).normalize();
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));

    let currentVrm = null;
    const idDisplay = document.getElementById('current-id-display');

    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));

    const vrmPath = './kamui_face.vrm?v=' + Date.now();

    loader.load(vrmPath, (gltf) => {
        const vrm = gltf.userData.vrm;
        currentVrm = vrm;
        scene.add(vrm.scene);
        
        vrm.scene.rotation.y = Math.PI; 
        
        document.getElementById('loading').style.display = 'none';
        console.log("Kamui Expression Curator (VER 3.1: CHIMERA MIX) オンライン。");
        
        window.applyCurated = applyCurated;

    }, undefined, (error) => {
        loader.load('./kamui_face.vrm', (fallbackGltf) => {
            const vrm = fallbackGltf.userData.vrm;
            currentVrm = vrm;
            scene.add(vrm.scene);
            vrm.scene.rotation.y = Math.PI; 
            document.getElementById('loading').style.display = 'none';
            window.applyCurated = applyCurated;
        });
    });

    function applyCurated(emotionKey, btnElement) {
        if (!currentVrm || !currentVrm.expressionManager) return;

        // 全表情のリセット
        currentVrm.expressionManager.expressions.forEach(exp => {
            currentVrm.expressionManager.setValue(exp.expressionName, 0.0);
        });

        let appliedId = "";

        // 🚀 【キメラ・ミックス・プロトコル】強制的に複数の表情を合成する
        if (emotionKey === 'sick') {
            const mixRecipe = [
                { ids: ['happy', 'joy', 'Joy'], val: 1.0 },       // 口元の不気味な笑み
                { ids: ['surprised', 'Surprised'], val: 0.8 },    // 目をガンギマリに開く
                { ids: ['blinkLeft', 'Blink_L'], val: 0.9 },      // 片目だけ痙攣させる（ゲスいウインク）
                { ids: ['aa', 'a', 'A'], val: 0.5 }               // 口を少し開いてアホっぽく
            ];
            
            mixRecipe.forEach(item => {
                for (const id of item.ids) {
                    if (currentVrm.expressionManager.getExpression(id)) {
                        currentVrm.expressionManager.setValue(id, item.val);
                        appliedId += `[${id}:${item.val}] `;
                        break; 
                    }
                }
            });
            if (appliedId === "") appliedId = "SYNTHESIS FAILED (No BlendShapes found)";
        } 
        // 🚀 通常の表情（純度100%）
        else {
            const targetIds = EMOTION_WHITELIST[emotionKey];
            if (targetIds) {
                for (const id of targetIds) {
                    const exp = currentVrm.expressionManager.getExpression(id);
                    if (exp) {
                        currentVrm.expressionManager.setValue(id, 1.0);
                        appliedId = id;
                        break; 
                    }
                }
            }
            if (appliedId === "") appliedId = "NONE (NOT FOUND)";
        }

        idDisplay.innerText = `VRM ID: ${appliedId}`;
        
        const buttons = document.querySelectorAll('.exp-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
    }

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      if (currentVrm) currentVrm.update(clock.getDelta());
      controls.update(); 
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
