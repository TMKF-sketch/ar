<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ElekiNail AR - かわうそくん MJ Dance</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
    }
    #camera-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: none;
      z-index: 1;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      padding: 20px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 15, 25, 0.75);
      backdrop-filter: blur(10px);
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid rgba(0, 255, 200, 0.3);
      box-shadow: 0 4px 20px rgba(0, 255, 200, 0.15);
    }
    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #00ffcc;
      text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #00ff88;
      font-weight: 700;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #00ff88;
      box-shadow: 0 0 8px #00ff88;
    }
    .dot.mj {
      background-color: #ff0055;
      box-shadow: 0 0 12px #ff0055;
      animation: pulse 0.5s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.4); }
    }
    .hint-bar {
      font-size: 12px;
      color: #fff;
      text-align: center;
      background: rgba(10, 15, 25, 0.75);
      padding: 8px 16px;
      border-radius: 20px;
      align-self: center;
      border: 1px solid rgba(0, 255, 200, 0.2);
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.0/lib/three-vrm.module.js"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <video id="camera-video" playsinline webkit-playsinline></video>
  <div id="canvas-container"></div>

  <div id="ui-overlay">
    <div class="header-bar">
      <div class="brand-title">ELEKINAIL : DANCE AR</div>
      <div class="status-indicator">
        <span id="load-status">NORMAL DANCE</span>
        <div id="status-dot" class="dot"></div>
      </div>
    </div>

    <div class="hint-bar" id="hint-msg">
      ✊ 手を「グー」に握ると MJモード発動！
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

    let scene, camera, renderer;
    let currentVrm = null;
    let clock = new THREE.Clock();
    const baseScale = 1.05;

    let isMjMode = false;
    let updateOtterDance = null;

    const urlParams = new URLSearchParams(window.location.search);
    const charParam = urlParams.get('char');
    const explicitVrm = urlParams.get('vrm');

    let candidateUrls = [];
    if (explicitVrm) {
      candidateUrls.push(explicitVrm);
    } else if (charParam) {
      candidateUrls.push(`./${charParam}.vrm`);
    } else {
      candidateUrls.push('./kawauso.vrm', './otter.vrm', './avatar.vrm', './hoshiokun.vrm', './hoshio.vrm');
    }

    // --- ダンス制御（通常 ＆ MJ激辛モード） ---
    function createOtterDance(vrm) {
      const humanoid = vrm.humanoid;
      if (!humanoid) return () => {};

      const hips = humanoid.getNormalizedBoneNode('hips');
      const spine = humanoid.getNormalizedBoneNode('spine');
      const head = humanoid.getNormalizedBoneNode('head');
      const leftUpperArm = humanoid.getNormalizedBoneNode('leftUpperArm');
      const rightUpperArm = humanoid.getNormalizedBoneNode('rightUpperArm');
      const leftLowerArm = humanoid.getNormalizedBoneNode('leftLowerArm');
      const rightLowerArm = humanoid.getNormalizedBoneNode('rightLowerArm');
      const leftUpperLeg = humanoid.getNormalizedBoneNode('leftUpperLeg');
      const rightUpperLeg = humanoid.getNormalizedBoneNode('rightUpperLeg');

      const initialHipsY = hips ? hips.position.y : 0;

      return function updateDance(elapsedTime, intenseMode) {
        if (!intenseMode) {
          // --- 通常のかわうそダンス (BPM 125) ---
          const t = elapsedTime * ((125 / 60) * Math.PI);

          if (hips) {
            hips.position.y = initialHipsY + Math.abs(Math.sin(t)) * 0.04;
            hips.rotation.y = Math.sin(t * 0.5) * 0.18;
            hips.rotation.x = 0;
            hips.rotation.z = 0;
          }
          if (spine) {
            spine.rotation.z = Math.sin(t * 0.5) * 0.1;
            spine.rotation.x = Math.sin(t) * 0.05 + 0.02;
          }
          if (head) {
            head.rotation.z = -Math.sin(t * 0.5) * 0.12;
            head.rotation.y = Math.sin(t * 0.5) * 0.12;
            head.rotation.x = 0;
          }
          if (leftUpperArm && rightUpperArm) {
            leftUpperArm.rotation.z = Math.PI / 3 + Math.sin(t) * 0.25;
            leftUpperArm.rotation.x = Math.cos(t) * 0.2;
            rightUpperArm.rotation.z = -Math.PI / 3 - Math.sin(t) * 0.25;
            rightUpperArm.rotation.x = Math.cos(t) * 0.2;
          }
          if (leftLowerArm && rightLowerArm) {
            leftLowerArm.rotation.y = -Math.PI / 4 + Math.sin(t) * 0.35;
            rightLowerArm.rotation.y = Math.PI / 4 - Math.sin(t) * 0.35;
          }
          if (leftUpperLeg && rightUpperLeg) {
            leftUpperLeg.rotation.x = -Math.sin(t * 0.5) * 0.15;
            rightUpperLeg.rotation.x = Math.sin(t * 0.5) * 0.15;
          }
          if (vrm.expressionManager) {
            vrm.expressionManager.setValue('happy', 0.85);
            vrm.expressionManager.update();
          }
        } else {
          // --- 🔥 マイケル・ジャクソン風 激辛モード (BPM 138) ---
          const t = elapsedTime * ((138 / 60) * Math.PI);
          const beatSnap = Math.sign(Math.sin(t)) * Math.pow(Math.abs(Math.sin(t)), 0.3);

          if (hips) {
            hips.position.y = initialHipsY + Math.abs(Math.sin(t * 2)) * 0.06;
            hips.rotation.y = beatSnap * 0.35; // 鋭い腰のキレ
            hips.rotation.z = Math.sin(t) * 0.15;
          }
          if (spine) {
            spine.rotation.x = 0.15 + Math.sin(t * 2) * 0.1; // 前傾ビート
            spine.rotation.y = -beatSnap * 0.2;
          }
          if (head) {
            head.rotation.x = -0.1 + Math.sin(t * 2) * 0.15; // 鋭いヘッドバンギング
            head.rotation.z = Math.sin(t) * 0.2;
          }

          // MJシグネチャーポーズ（右手でハットを押さえ、左手を横へキレよく突き出す）
          if (rightUpperArm && rightLowerArm) {
            rightUpperArm.rotation.x = 1.3;
            rightUpperArm.rotation.z = -0.6 + Math.sin(t * 2) * 0.1;
            rightLowerArm.rotation.y = 1.2;
          }
          if (leftUpperArm && leftLowerArm) {
            leftUpperArm.rotation.x = -0.2;
            leftUpperArm.rotation.z = Math.PI / 2.2 + beatSnap * 0.3; // 腕を水平にキック
            leftLowerArm.rotation.y = -0.1;
          }

          // ムーンウォーク風レッグアクション
          if (leftUpperLeg && rightUpperLeg) {
            leftUpperLeg.rotation.x = Math.sin(t) * 0.45;
            rightUpperLeg.rotation.x = -Math.sin(t) * 0.45;
          }

          if (vrm.expressionManager) {
            vrm.expressionManager.setValue('happy', 0.2);
            vrm.expressionManager.setValue('surprised', 0.5);
            vrm.expressionManager.update();
          }
        }
      };
    }

    function initThree() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 20);
      camera.position.set(0, 1.2, 2.5);

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
      dirLight.position.set(1.0, 2.0, 1.0).normalize();
      scene.add(dirLight);

      tryLoadCandidates(0);
      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function tryLoadCandidates(index) {
      if (index >= candidateUrls.length) return;

      const targetUrl = candidateUrls[index];
      const loader = new GLTFLoader();
      loader.register((parser) => new VRMLoaderPlugin(parser));

      loader.load(
        targetUrl,
        (gltf) => {
          const vrm = gltf.userData.vrm;
          VRMUtils.removeUnnecessaryVertices(gltf.scene);
          VRMUtils.removeUnnecessaryJoints(gltf.scene);

          currentVrm = vrm;
          scene.add(vrm.scene);

          vrm.scene.rotation.y = Math.PI;
          vrm.scene.position.set(0, 0, 0);
          vrm.scene.scale.set(baseScale, baseScale, baseScale);

          updateOtterDance = createOtterDance(vrm);
        },
        undefined,
        () => {
          tryLoadCandidates(index + 1);
        }
      );
    }

    // --- グー / パー 判定ロジック ---
    function checkFist(landmarks) {
      const wrist = landmarks[0];
      const tips = [8, 12, 16, 20]; // 人差し指・中指・薬指・小指の指先
      const mcps = [5, 9, 13, 17];  // 各指の付け根

      let foldedFingers = 0;
      for (let i = 0; i < 4; i++) {
        const tipDist = Math.hypot(landmarks[tips[i]].x - wrist.x, landmarks[landmarks[tips[i]].y - wrist.y]);
        const mcpDist = Math.hypot(landmarks[mcps[i]].x - wrist.x, landmarks[mcps[i]].y - wrist.y);
        if (tipDist < mcpDist * 1.15) {
          foldedFingers++;
        }
      }
      return foldedFingers >= 3; // 3本以上折りたたまれていれば「グー」
    }

    const videoElement = document.getElementById('camera-video');

    function initHandTracking() {
      const statusText = document.getElementById('load-status');
      const statusDot = document.getElementById('status-dot');

      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
      });

      hands.onResults((results) => {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          const landmarks = results.multiHandLandmarks[0];
          const palmCenter = landmarks[9];

          // グー・パーの判定
          const isFist = checkFist(landmarks);
          if (isFist !== isMjMode) {
            isMjMode = isFist;
            if (isMjMode) {
              statusText.innerText = "🔥 MJ DANCE MODE";
              statusDot.className = "dot mj";
            } else {
              statusText.innerText = "NORMAL DANCE";
              statusDot.className = "dot";
            }
          }

          if (currentVrm) {
            const x = (palmCenter.x - 0.5) * 2.2;
            const y = (0.5 - palmCenter.y) * 1.8 + 0.75;
            const z = (palmCenter.z || 0) * -1.5;

            currentVrm.scene.position.x += (x - currentVrm.scene.position.x) * 0.2;
            currentVrm.scene.position.y += (y - currentVrm.scene.position.y) * 0.2;
            currentVrm.scene.position.z += (z - currentVrm.scene.position.z) * 0.2;
          }
        }
      });

      const cameraFeed = new Camera(videoElement, {
        onFrame: async () => {
          await hands.send({ image: videoElement });
        },
        width: 1280,
        height: 720,
        facingMode: 'environment'
      });

      cameraFeed.start();
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const elapsedTime = clock.getElapsedTime();

      if (currentVrm) {
        if (updateOtterDance) {
          updateOtterDance(elapsedTime, isMjMode);
        }
        currentVrm.update(delta);
      }
      renderer.render(scene, camera);
    }

    initThree();
    animate();
    initHandTracking();
  </script>
</body>
</html>
