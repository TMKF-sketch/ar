<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ElekiNail AR - かわうそくん Dance & Moonwalk</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
    }
    #camera-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: none;
      z-index: 1;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      padding: 20px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 15, 25, 0.75);
      backdrop-filter: blur(10px);
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid rgba(0, 255, 200, 0.3);
      box-shadow: 0 4px 20px rgba(0, 255, 200, 0.15);
    }
    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #00ffcc;
      text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #00ff88;
      font-weight: 700;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #00ff88;
      box-shadow: 0 0 8px #00ff88;
    }
    .dot.spin {
      background-color: #ffaa00;
      box-shadow: 0 0 12px #ffaa00;
      animation: pulse 0.3s infinite alternate;
    }
    .dot.moonwalk {
      background-color: #00e5ff;
      box-shadow: 0 0 14px #00e5ff;
      animation: pulse 0.4s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.5); }
    }
    .hint-bar {
      font-size: 12px;
      color: #fff;
      text-align: center;
      background: rgba(10, 15, 25, 0.75);
      padding: 8px 16px;
      border-radius: 20px;
      align-self: center;
      border: 1px solid rgba(0, 255, 200, 0.2);
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.0/lib/three-vrm.module.js"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <video id="camera-video" playsinline webkit-playsinline></video>
  <div id="canvas-container"></div>

  <div id="ui-overlay">
    <div class="header-bar">
      <div class="brand-title">ELEKINAIL : DANCE AR</div>
      <div class="status-indicator">
        <span id="load-status">READY</span>
        <div id="status-dot" class="dot"></div>
      </div>
    </div>

    <div class="hint-bar" id="hint-msg">
      ✊ グーで3回転スピン / 👋 ヒラヒラでムーンウォーク
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

    let scene, camera, renderer;
    let currentVrm = null;
    let clock = new THREE.Clock();
    const baseScale = 1.05;

    let isSpinning = false;
    let wasFist = false;
    let isMoonwalkMode = false;
    let updateOtterDance = null;
    let moonwalkSlideOffset = 0;

    // ヒラヒラ判定用（手首の傾き履歴）
    let lastWristAngle = 0;
    let waveEnergy = 0;

    const urlParams = new URLSearchParams(window.location.search);
    const charParam = urlParams.get('char');
    const explicitVrm = urlParams.get('vrm');

    let candidateUrls = [];
    if (explicitVrm) {
      candidateUrls.push(explicitVrm);
    } else if (charParam) {
      candidateUrls.push(`./${charParam}.vrm`);
    } else {
      candidateUrls.push('./kawauso.vrm', './otter.vrm', './avatar.vrm', './hoshiokun.vrm', './hoshio.vrm');
    }

    // --- ダンス & ムーンウォーク モーション制御 ---
    function createOtterDance(vrm) {
      const humanoid = vrm.humanoid;
      if (!humanoid) return () => {};

      const hips = humanoid.getNormalizedBoneNode('hips');
      const spine = humanoid.getNormalizedBoneNode('spine');
      const head = humanoid.getNormalizedBoneNode('head');
      const leftUpperArm = humanoid.getNormalizedBoneNode('leftUpperArm');
      const rightUpperArm = humanoid.getNormalizedBoneNode('rightUpperArm');
      const leftLowerArm = humanoid.getNormalizedBoneNode('leftLowerArm');
      const rightLowerArm = humanoid.getNormalizedBoneNode('rightLowerArm');
      const leftUpperLeg = humanoid.getNormalizedBoneNode('leftUpperLeg');
      const rightUpperLeg = humanoid.getNormalizedBoneNode('rightUpperLeg');
      const leftLowerLeg = humanoid.getNormalizedBoneNode('leftLowerLeg');
      const rightLowerLeg = humanoid.getNormalizedBoneNode('rightLowerLeg');
      const leftFoot = humanoid.getNormalizedBoneNode('leftFoot');
      const rightFoot = humanoid.getNormalizedBoneNode('rightFoot');

      const initialHipsY = hips ? hips.position.y : 0;

      return function updateDance(elapsedTime, moonwalkActive) {
        if (!moonwalkActive) {
          // --- 通常ダンス ---
          if (!isSpinning) {
            vrm.scene.rotation.y = Math.PI; // 正面向き
          }
          moonwalkSlideOffset = 0;

          const t = elapsedTime * ((125 / 60) * Math.PI);

          if (hips) {
            hips.position.y = initialHipsY + Math.abs(Math.sin(t)) * 0.04;
            hips.rotation.y = Math.sin(t * 0.5) * 0.18;
            hips.rotation.x = 0;
            hips.rotation.z = 0;
          }
          if (spine) {
            spine.rotation.z = Math.sin(t * 0.5) * 0.1;
            spine.rotation.x = Math.sin(t) * 0.05 + 0.02;
          }
          if (head) {
            head.rotation.z = -Math.sin(t * 0.5) * 0.12;
            head.rotation.y = Math.sin(t * 0.5) * 0.12;
          }
          if (leftUpperArm && rightUpperArm) {
            leftUpperArm.rotation.z = Math.PI / 3 + Math.sin(t) * 0.25;
            leftUpperArm.rotation.x = Math.cos(t) * 0.2;
            rightUpperArm.rotation.z = -Math.PI / 3 - Math.sin(t) * 0.25;
            rightUpperArm.rotation.x = Math.cos(t) * 0.2;
          }
          if (leftLowerArm && rightLowerArm) {
            leftLowerArm.rotation.y = -Math.PI / 4 + Math.sin(t) * 0.35;
            rightLowerArm.rotation.y = Math.PI / 4 - Math.sin(t) * 0.35;
          }
          if (leftUpperLeg && rightUpperLeg) {
            leftUpperLeg.rotation.x = -Math.sin(t * 0.5) * 0.15;
            rightUpperLeg.rotation.x = Math.sin(t * 0.5) * 0.15;
            if (leftLowerLeg) leftLowerLeg.rotation.x = 0;
            if (rightLowerLeg) rightLowerLeg.rotation.x = 0;
          }
          if (leftFoot && rightFoot) {
            leftFoot.rotation.x = 0;
            rightFoot.rotation.x = 0;
          }
          if (vrm.expressionManager) {
            vrm.expressionManager.setValue('happy', 0.85);
            vrm.expressionManager.update();
          }
        } else {
          // --- 🕺 MOONWALK MODE ---
          if (!isSpinning) {
            vrm.scene.rotation.y = Math.PI / 2; // 体を横に向ける
          }

          const t = elapsedTime * 4.0;
          const phase = Math.sin(t);
          moonwalkSlideOffset = Math.sin(elapsedTime * 1.5) * 0.45;

          if (hips) {
            hips.position.y = initialHipsY + 0.02;
            hips.rotation.y = 0;
            hips.rotation.x = -0.05;
          }
          if (spine) {
            spine.rotation.x = 0.12;
            spine.rotation.z = 0;
          }
          if (head) {
            head.rotation.x = -0.08;
            head.rotation.y = -0.4;
          }

          if (rightUpperArm && rightLowerArm) {
            rightUpperArm.rotation.x = 0.8;
            rightUpperArm.rotation.z = -0.4;
            rightLowerArm.rotation.y = 1.0;
          }
          if (leftUpperArm && leftLowerArm) {
            leftUpperArm.rotation.x = -0.3 + Math.cos(t) * 0.15;
            leftUpperArm.rotation.z = 0.3;
            leftLowerArm.rotation.y = -0.2;
          }

          if (phase > 0) {
            if (rightUpperLeg && rightLowerLeg && rightFoot) {
              rightUpperLeg.rotation.x = 0.35;
              rightLowerLeg.rotation.x = -0.7;
              rightFoot.rotation.x = 0.5;
            }
            if (leftUpperLeg && leftLowerLeg && leftFoot) {
              leftUpperLeg.rotation.x = -0.25 * phase;
              leftLowerLeg.rotation.x = 0.05;
              leftFoot.rotation.x = -0.05;
            }
          } else {
            const p = Math.abs(phase);
            if (leftUpperLeg && leftLowerLeg && leftFoot) {
              leftUpperLeg.rotation.x = 0.35;
              leftLowerLeg.rotation.x = -0.7;
              leftFoot.rotation.x = 0.5;
            }
            if (rightUpperLeg && rightLowerLeg && rightFoot) {
              rightUpperLeg.rotation.x = -0.25 * p;
              rightLowerLeg.rotation.x = 0.05;
              rightFoot.rotation.x = -0.05;
            }
          }

          if (vrm.expressionManager) {
            vrm.expressionManager.setValue('happy', 0.3);
            vrm.expressionManager.setValue('neutral', 0.7);
            vrm.expressionManager.update();
          }
        }
      };
    }

    // --- ① 3回転（1080度）スピンアクション ---
    function triggerTripleSpin() {
      if (!currentVrm || isSpinning) return;
      isSpinning = true;

      const statusText = document.getElementById('load-status');
      const statusDot = document.getElementById('status-dot');
      statusText.innerText = "🌪️ 3 SPIN!";
      statusDot.className = "dot spin";

      const startRotY = currentVrm.scene.rotation.y;
      const totalRotation = Math.PI * 6; // 3回転
      const duration = 1100;
      const startTime = performance.now();

      function step(now) {
        const elapsed = now - startTime;
        const p = Math.min(elapsed / duration, 1.0);
        const ease = p < 0.5 ? 2 * p * p : -1 + (4 - 2 * p) * p;
        currentVrm.scene.rotation.y = startRotY + ease * totalRotation;

        if (p < 1.0) {
          requestAnimationFrame(step);
        } else {
          currentVrm.scene.rotation.y = isMoonwalkMode ? Math.PI / 2 : Math.PI;
          isSpinning = false;
          if (isMoonwalkMode) {
            statusText.innerText = "🕺 MOONWALK";
            statusDot.className = "dot moonwalk";
          } else {
            statusText.innerText = "READY";
            statusDot.className = "dot";
          }
        }
      }
      requestAnimationFrame(step);
    }

    function initThree() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 20);
      camera.position.set(0, 1.2, 2.5);

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
      dirLight.position.set(1.0, 2.0, 1.0).normalize();
      scene.add(dirLight);

      tryLoadCandidates(0);
      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function tryLoadCandidates(index) {
      if (index >= candidateUrls.length) return;

      const targetUrl = candidateUrls[index];
      const loader = new GLTFLoader();
      loader.register((parser) => new VRMLoaderPlugin(parser));

      loader.load(
        targetUrl,
        (gltf) => {
          const vrm = gltf.userData.vrm;
          VRMUtils.removeUnnecessaryVertices(gltf.scene);
          VRMUtils.removeUnnecessaryJoints(gltf.scene);

          currentVrm = vrm;
          scene.add(vrm.scene);

          vrm.scene.rotation.y = Math.PI;
          vrm.scene.position.set(0, 0, 0);
          vrm.scene.scale.set(baseScale, baseScale, baseScale);

          updateOtterDance = createOtterDance(vrm);
        },
        undefined,
        () => {
          tryLoadCandidates(index + 1);
        }
      );
    }

    // --- グー判定 ---
    function checkFist(lm) {
      const wrist = lm[0];
      const tips = [8, 12, 16, 20];
      const pips = [6, 10, 14, 18];

      let foldedCount = 0;
      for (let i = 0; i < 4; i++) {
        const dTip = Math.hypot(lm[tips[i]].x - wrist.x, lm[tips[i]].y - wrist.y);
        const dPip = Math.hypot(lm[pips[i]].x - wrist.x, lm[pips[i]].y - wrist.y);
        if (dTip < dPip) {
          foldedCount++;
        }
      }
      return foldedCount >= 3;
    }

    // --- ② 手のひらヒラヒラ（Wave）判定 ---
    function checkWave(lm) {
      const wrist = lm[0];
      const middleMcp = lm[9]; // 中指付け根
      // 手首から中指への傾き角度 (ラジアン)
      const currentAngle = Math.atan2(middleMcp.y - wrist.y, middleMcp.x - wrist.x);
      
      const angularDiff = Math.abs(currentAngle - lastWristAngle);
      lastWristAngle = currentAngle;

      // 角度変化速度をエネルギーとして蓄積
      if (angularDiff > 0.08 && angularDiff < 1.2) {
        waveEnergy = Math.min(waveEnergy + 0.35, 1.5);
      } else {
        waveEnergy = Math.max(waveEnergy - 0.05, 0);
      }

      // エネルギーが一定以上ならヒラヒラ状態
      return waveEnergy > 0.6;
    }

    const videoElement = document.getElementById('camera-video');

    function initHandTracking() {
      const statusText = document.getElementById('load-status');
      const statusDot = document.getElementById('status-dot');

      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
      });

      hands.onResults((results) => {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          const landmarks = results.multiHandLandmarks[0];
          const palmCenter = landmarks[9];

          // 1. グー判定 ➔ スピン発動
          const isFist = checkFist(landmarks);
          if (isFist && !wasFist) {
            triggerTripleSpin();
          }
          wasFist = isFist;

          // 2. ヒラヒラ判定 ➔ ムーンウォーク切り替え (パーの時のみ)
          if (!isFist) {
            const waving = checkWave(landmarks);
            if (waving !== isMoonwalkMode) {
              isMoonwalkMode = waving;
              if (isMoonwalkMode && !isSpinning) {
                statusText.innerText = "🕺 MOONWALK";
                statusDot.className = "dot moonwalk";
              } else if (!isSpinning) {
                statusText.innerText = "READY";
                statusDot.className = "dot";
              }
            }
          }

          if (currentVrm) {
            const x = (palmCenter.x - 0.5) * 2.2 + (isMoonwalkMode ? moonwalkSlideOffset : 0);
            const y = (0.5 - palmCenter.y) * 1.8 + 0.75;
            const z = (palmCenter.z || 0) * -1.5;

            currentVrm.scene.position.x += (x - currentVrm.scene.position.x) * 0.2;
            currentVrm.scene.position.y += (y - currentVrm.scene.position.y) * 0.2;
            currentVrm.scene.position.z += (z - currentVrm.scene.position.z) * 0.2;
          }
        }
      });

      const cameraFeed = new Camera(videoElement, {
        onFrame: async () => {
          await hands.send({ image: videoElement });
        },
        width: 1280,
        height: 720,
        facingMode: 'environment'
      });

      cameraFeed.start();
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const elapsedTime = clock.getElapsedTime();

      if (currentVrm) {
        if (updateOtterDance) {
          updateOtterDance(elapsedTime, isMoonwalkMode);
        }
        currentVrm.update(delta);
      }
      renderer.render(scene, camera);
    }

    initThree();
    animate();
    initHandTracking();
  </script>
</body>
</html>
