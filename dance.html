<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ElekiNail AR - かわうそくん ダンス</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
    }
    #camera-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: none;
      z-index: 1;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      padding: 20px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 15, 25, 0.75);
      backdrop-filter: blur(10px);
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid rgba(0, 255, 200, 0.3);
      box-shadow: 0 4px 20px rgba(0, 255, 200, 0.15);
    }
    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #00ffcc;
      text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #00ff88;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #00ff88;
      box-shadow: 0 0 8px #00ff88;
    }
    .hint-bar {
      font-size: 11px;
      color: #778899;
      text-align: center;
      background: rgba(10, 15, 25, 0.6);
      padding: 8px 16px;
      border-radius: 20px;
      align-self: center;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2.1.0/lib/three-vrm.module.js"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <video id="camera-video" playsinline webkit-playsinline></video>
  <div id="canvas-container"></div>

  <div id="ui-overlay">
    <div class="header-bar">
      <div class="brand-title">ELEKINAIL : OTTER DANCE</div>
      <div class="status-indicator">
        <span id="load-status">DANCE READY</span>
        <div class="dot"></div>
      </div>
    </div>

    <div class="hint-bar">
      手のひらをカメラにかざしてください
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

    let scene, camera, renderer;
    let currentVrm = null;
    let clock = new THREE.Clock();
    const baseScale = 0.7;

    let updateOtterDance = null;

    const urlParams = new URLSearchParams(window.location.search);
    const charParam = urlParams.get('char');
    const explicitVrm = urlParams.get('vrm');

    let candidateUrls = [];
    if (explicitVrm) {
      candidateUrls.push(explicitVrm);
    } else if (charParam) {
      candidateUrls.push(`./${charParam}.vrm`);
    } else {
      candidateUrls.push('./kawauso.vrm', './otter.vrm', './avatar.vrm', './hoshiokun.vrm', './hoshio.vrm');
    }

    function createOtterDance(vrm) {
      const humanoid = vrm.humanoid;
      if (!humanoid) return () => {};

      const hips = humanoid.getNormalizedBoneNode('hips');
      const spine = humanoid.getNormalizedBoneNode('spine');
      const head = humanoid.getNormalizedBoneNode('head');
      const leftUpperArm = humanoid.getNormalizedBoneNode('leftUpperArm');
      const rightUpperArm = humanoid.getNormalizedBoneNode('rightUpperArm');
      const leftLowerArm = humanoid.getNormalizedBoneNode('leftLowerArm');
      const rightLowerArm = humanoid.getNormalizedBoneNode('rightLowerArm');
      const leftUpperLeg = humanoid.getNormalizedBoneNode('leftUpperLeg');
      const rightUpperLeg = humanoid.getNormalizedBoneNode('rightUpperLeg');

      const initialHipsY = hips ? hips.position.y : 0;
      const bpm = 128;
      const speed = (bpm / 60) * Math.PI;

      return function updateDance(elapsedTime) {
        const t = elapsedTime * speed;

        if (hips) {
          hips.position.y = initialHipsY + Math.abs(Math.sin(t)) * 0.04;
          hips.rotation.y = Math.sin(t * 0.5) * 0.18;
        }

        if (spine) {
          spine.rotation.z = Math.sin(t * 0.5) * 0.1;
          spine.rotation.x = Math.sin(t) * 0.05 + 0.02;
        }
        if (head) {
          head.rotation.z = -Math.sin(t * 0.5) * 0.12;
          head.rotation.y = Math.sin(t * 0.5) * 0.12;
        }

        if (leftUpperArm && rightUpperArm) {
          leftUpperArm.rotation.z = Math.PI / 3 + Math.sin(t) * 0.25;
          leftUpperArm.rotation.x = Math.cos(t) * 0.2;

          rightUpperArm.rotation.z = -Math.PI / 3 - Math.sin(t) * 0.25;
          rightUpperArm.rotation.x = Math.cos(t) * 0.2;
        }

        if (leftLowerArm && rightLowerArm) {
          leftLowerArm.rotation.y = -Math.PI / 4 + Math.sin(t) * 0.35;
          rightLowerArm.rotation.y = Math.PI / 4 - Math.sin(t) * 0.35;
        }

        if (leftUpperLeg && rightUpperLeg) {
          leftUpperLeg.rotation.x = -Math.sin(t * 0.5) * 0.15;
          rightUpperLeg.rotation.x = Math.sin(t * 0.5) * 0.15;
        }

        if (vrm.expressionManager) {
          vrm.expressionManager.setValue('happy', 0.85);
          vrm.expressionManager.update();
        }
      };
    }

    function initThree() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 20);
      camera.position.set(0, 1.2, 2.5);

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
      dirLight.position.set(1.0, 2.0, 1.0).normalize();
      scene.add(dirLight);

      tryLoadCandidates(0);
      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function tryLoadCandidates(index) {
      if (index >= candidateUrls.length) {
        document.getElementById('load-status').innerText = "VRM NOT FOUND";
        return;
      }

      const targetUrl = candidateUrls[index];
      const loader = new GLTFLoader();
      loader.register((parser) => new VRMLoaderPlugin(parser));

      loader.load(
        targetUrl,
        (gltf) => {
          const vrm = gltf.userData.vrm;
          VRMUtils.removeUnnecessaryVertices(gltf.scene);
          VRMUtils.removeUnnecessaryJoints(gltf.scene);

          currentVrm = vrm;
          scene.add(vrm.scene);

          vrm.scene.rotation.y = Math.PI;
          vrm.scene.position.set(0, 0, 0);
          vrm.scene.scale.set(baseScale, baseScale, baseScale);

          updateOtterDance = createOtterDance(vrm);
          document.getElementById('load-status').innerText = "DANCING";
        },
        undefined,
        () => {
          tryLoadCandidates(index + 1);
        }
      );
    }

    const videoElement = document.getElementById('camera-video');

    function initHandTracking() {
      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
      });

      hands.onResults((results) => {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          const landmarks = results.multiHandLandmarks[0];
          const palmCenter = landmarks[9];

          if (currentVrm) {
            const x = (palmCenter.x - 0.5) * 2.2;
            // Yオフセットを +0.65 まで大幅にリフト
            const y = (0.5 - palmCenter.y) * 1.8 + 0.65;
            const z = (palmCenter.z || 0) * -1.5;

            currentVrm.scene.position.x += (x - currentVrm.scene.position.x) * 0.2;
            currentVrm.scene.position.y += (y - currentVrm.scene.position.y) * 0.2;
            currentVrm.scene.position.z += (z - currentVrm.scene.position.z) * 0.2;
          }
        }
      });

      const cameraFeed = new Camera(videoElement, {
        onFrame: async () => {
          await hands.send({ image: videoElement });
        },
        width: 1280,
        height: 720,
        facingMode: 'environment'
      });

      cameraFeed.start();
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const elapsedTime = clock.getElapsedTime();

      if (currentVrm) {
        if (updateOtterDance) {
          updateOtterDance(elapsedTime);
        }
        currentVrm.update(delta);
      }
      renderer.render(scene, camera);
    }

    initThree();
    animate();
    initHandTracking();
  </script>
</body>
</html>
