<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Kamui Expression Curator (VER 151)</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #111; font-family: -apple-system, monospace; color: #fff; user-select: none; }
    /* 🚀 V93: kamui.html 準拠のフルスクリーン AR カメラ背景 */
    #camera-video {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1; transform: none;
    }

    #webgl-canvas {
      display: block; width: 100vw; height: 100vh;
      position: absolute; top: 0; left: 0; z-index: 2;
    }
    
    #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #00ffcc; font-size: 20px; font-weight: bold; pointer-events: none; z-index: 100;
      text-shadow: 0 0 10px rgba(0,255,204,0.5);
    }

    #version-text {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%); color: #00ffcc; font-size: 12px; 
      font-weight: 900; background: rgba(0,0,0,0.75); padding: 4px 12px; border-radius: 20px; z-index: 9999; border: 1.5px solid #00ffcc;
      box-shadow: 0 0 12px rgba(0,255,204,0.6); pointer-events: none; white-space: nowrap;
    }
    
    #ui-panel {
      display: none !important;
    }
    
    .action-btn {
      background: #222; border: 1px solid #555; color: #ccc;
      padding: 8px 10px; border-radius: 6px; font-size: 11px; font-weight: bold;
      cursor: pointer; transition: all 0.2s ease; text-transform: uppercase;
      text-align: left; line-height: 1.2;
    }
    
    .action-btn:hover { background: #333; border-color: #888; color: #fff; }
    
    .action-btn.active {
      background: rgba(0, 255, 204, 0.2); border-color: #00ffcc; color: #00ffcc;
      box-shadow: 0 0 10px rgba(0,255,204,0.5);
    }

    .action-btn.yabai { border-color: #ff0055; color: #ff88aa; }
    .action-btn.yabai.active {
      background: rgba(255, 0, 85, 0.3); border-color: #ff0055; color: #ff0055;
      box-shadow: 0 0 10px rgba(255,0,85,0.8);
    }

    #current-id-display {
      display: none !important;
    }
    
    #hand-status-badge {
      display: none !important;
    }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%; background-color: #00ffcc;
      box-shadow: 0 0 8px #00ffcc; transition: all 0.3s;
    }
    .status-dot.tracking {
      background-color: #00ff88; box-shadow: 0 0 12px #00ff88;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.4); }
    }

    /* 🚀 V151: 最下部 4モード固定ドック (70%スリム化: height 34px) */
    #bottom-dock-nav {
      position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
      width: min(95vw, 540px); height: 34px;
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
      background: rgba(9, 14, 24, 0.92);
      padding: 3px; border-radius: 14px;
      border: 1.5px solid rgba(255, 215, 160, 0.55);
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.65), 0 0 14px rgba(255, 158, 199, 0.22);
      z-index: 40; backdrop-filter: blur(12px);
    }
    .dock-btn {
      background: transparent; border: 1px solid transparent; border-radius: 10px;
      color: #b8c2d4; cursor: pointer;
      display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 3px;
      transition: all 0.2s ease; padding: 0 4px; min-width: 0;
    }
    .dock-btn .dock-icon { font-size: 12px; line-height: 1.0; flex-shrink: 0; }
    .dock-btn .dock-label {
      font-size: 10px; font-weight: 800; letter-spacing: 0.1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .dock-btn.active-guide {
      background: linear-gradient(135deg, rgba(255, 126, 179, 0.32), rgba(255, 117, 140, 0.25));
      border-color: #ff9ec7; color: #fff;
      box-shadow: 0 0 12px rgba(255, 158, 199, 0.45);
    }
    .dock-btn.active-photo {
      background: linear-gradient(135deg, rgba(255, 215, 120, 0.35), rgba(255, 130, 170, 0.28));
      border-color: #ffd670; color: #fff8e6;
      box-shadow: 0 0 12px rgba(255, 214, 112, 0.5);
    }
    .dock-btn.active-game {
      background: linear-gradient(135deg, rgba(0, 255, 204, 0.28), rgba(0, 184, 255, 0.24));
      border-color: #00ffcc; color: #00ffcc;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.45);
    }
    .dock-btn.active-talk {
      background: linear-gradient(135deg, rgba(168, 130, 255, 0.34), rgba(255, 126, 179, 0.28));
      border-color: #c9a6ff; color: #fff;
      box-shadow: 0 0 12px rgba(186, 140, 255, 0.5);
    }

    /* BASIC MODE (ご案内): サロンコンシェルジュ HUD */
    #basic-mode-panel {
      position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
      width: 92%; max-width: 520px; z-index: 25;
      display: flex; flex-direction: column; gap: 7px;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    #basic-mode-panel.hidden { display: none !important; }

    #kamui-speech-bubble {
      background: rgba(15, 20, 32, 0.88); border: 1.5px solid #ff9ec7;
      border-radius: 16px; padding: 8px 12px; color: #fff; font-size: 12.5px;
      line-height: 1.38; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      backdrop-filter: blur(8px); position: relative;
    }
    #kamui-speech-bubble .speaker-tag {
      font-size: 10px; font-weight: 900; color: #ff9ec7;
      display: block; margin-bottom: 3px; letter-spacing: 0.8px;
    }

    #salon-quick-links {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    }
    .salon-chip {
      background: rgba(20, 25, 38, 0.88); border: 1px solid rgba(255, 158, 199, 0.55);
      color: #ffe3ef; padding: 7px 4px; border-radius: 10px; font-size: 11px;
      font-weight: bold; cursor: pointer; text-align: center;
      backdrop-filter: blur(6px); transition: all 0.2s;
    }
    .salon-chip:hover, .salon-chip:active {
      background: rgba(255, 117, 140, 0.35); border-color: #ff758c; color: #fff;
      transform: translateY(-1px);
    }

    #chat-input-row {
      display: flex; gap: 6px; background: rgba(10, 15, 25, 0.9);
      padding: 6px; border-radius: 24px; border: 1.5px solid rgba(255, 158, 199, 0.6);
      backdrop-filter: blur(8px);
    }
    #kamui-chat-input {
      flex: 1; background: transparent; border: none; color: #fff;
      padding: 6px 12px; font-size: 13px; outline: none;
    }
    #kamui-chat-input::placeholder { color: #8892a4; }
    .chat-action-btn {
      background: linear-gradient(135deg, #ff7eb3, #ff758c); border: none;
      color: #fff; padding: 6px 14px; border-radius: 18px; font-size: 12px;
      font-weight: bold; cursor: pointer; white-space: nowrap;
    }
    .chat-mic-btn {
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
      color: #fff; width: 32px; height: 32px; border-radius: 50%;
      font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .chat-mic-btn.recording {
      background: #ff0055; border-color: #ff0055; animation: pulse 0.8s infinite alternate;
    }

    /* GAME MODE: 14サインハント HUD */
    #game-mode-panel {
      position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
      width: 92%; max-width: 540px; z-index: 25;
      background: rgba(8, 14, 24, 0.88); border: 2px solid #00ffcc;
      border-radius: 16px; padding: 9px 12px;
      box-shadow: 0 0 24px rgba(0, 255, 204, 0.35); backdrop-filter: blur(8px);
      display: flex; flex-direction: column; gap: 6px;
    }
    #game-mode-panel.hidden { display: none !important; }

    .game-header-row {
      display: flex; justify-content: space-between; align-items: center; gap: 6px;
    }
    .game-title {
      font-size: 11px; font-weight: 900; color: #00ffcc; letter-spacing: 0.2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .game-progress-pill {
      background: rgba(0, 255, 204, 0.18); border: 1px solid #00ffcc;
      color: #00ffcc; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 900;
      white-space: nowrap; flex-shrink: 0;
    }
    #game-target-box {
      background: rgba(0, 255, 204, 0.1); border: 1px dashed rgba(0, 255, 204, 0.6);
      border-radius: 12px; padding: 6px 10px; text-align: center;
    }
    #game-target-label { font-size: 10.5px; color: #a8f0e0; display: block; margin-top: 2px; }
    #game-target-name { font-size: 17px; font-weight: 900; color: #ffdd00; text-shadow: 0 0 8px rgba(255,221,0,0.5); }
    #game-target-name.complete-blink {
      color: #ff1e42;
      text-shadow: 0 0 12px rgba(255, 30, 66, 0.9), 0 0 24px rgba(255, 30, 66, 0.6);
      animation: completeFlash 0.65s infinite alternate;
    }
    @keyframes completeFlash {
      0%   { opacity: 1; transform: scale(1.0); }
      100% { opacity: 0.25; transform: scale(1.04); }
    }
    #game-target-hint { font-size: 11px; color: #ffdd88; margin-top: 4px; display: none; }
    #game-target-hint.visible { display: block; }

    #game-stamp-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
    }
    .stamp-cell {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.18);
      border-radius: 6px; padding: 4px 0; text-align: center; font-size: 10px;
      color: #778; font-weight: bold;
    }
    .stamp-cell.found {
      background: rgba(0, 255, 136, 0.25); border-color: #00ff88; color: #00ff88;
      box-shadow: 0 0 8px rgba(0, 255, 136, 0.4);
    }
    .stamp-cell.current {
      border-color: #ffdd00; color: #ffdd00; background: rgba(255, 221, 0, 0.15);
    }
    .game-footer-row {
      display: flex; justify-content: center; align-items: center; gap: 8px;
    }
    .game-mini-btn {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25);
      color: #ddd; padding: 4px 10px; border-radius: 8px; font-size: 11px; cursor: pointer;
    }
    .game-mini-btn:hover { background: rgba(255,255,255,0.2); color: #fff; }


    /* 🚀 V132: Lueur ロゴバッジ（左上コーナー配置で中央のモモンガ＆上部スイッチと干渉しない設計） */
    #lueur-logo-badge {
      position: absolute; top: 14px; left: 14px;
      width: 58px; height: 58px; border-radius: 10px;
      overflow: hidden; background: #fff;
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
      z-index: 35; pointer-events: none;
    }
    #lueur-logo-badge img {
